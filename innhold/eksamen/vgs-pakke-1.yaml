tittel: "Vgs pakke 1: Kysten og de som blir igjen"
beskrivelse: "Denne pakken har et romanutdrag til kortsvaret og tre langsvarsoppgaver: en fagartikkel om litteraturens oppgave, et essay om å bli eller dra, og en novelletolkning. Alle tekstene er skrevet for øving."
status: godkjent
nivaa: vg3
oppsett: vgs
kjennetegnStatus: utkast
vedlegg:
  - id: v1
    tittel: "Vedlegg 1: Fyrvokteren (romanutdrag)"
    forfatter: "Utdrag fra en roman (fiktiv tekst for øving)"
    tekst: |-
      Båten la fra land før Marit rakk å snu seg. Hun ble stående på kaia med sekken i hånden, og fyret reiste seg over henne, hvitt og tungt som en gammel tanke.

      Hun hadde regnet med å føle noe. Lettelse, kanskje, eller sorg. I stedet kjente hun bare at bena var stive etter reisen, og at lukten av tang og diesel, som hadde vært sommer i barndommen, nå var noe annet. Den var en lukt hun kunne kjenne igjen uten å ville ha den.

      Stien opp fra kaia var like smal som før. Noen hadde lagt ut nye planker der de gamle hadde råtnet, men resten lå som den alltid hadde ligget: grå stein, krypende einer, og et gjerde som holdt ingenting ute. Marit telte stegene, slik hun hadde gjort som barn. Seksti-fem til døra. Hun trengte ikke telle lenger, men hun gjorde det likevel.

      Bestemor satt i kjøkkenvinduet. Hun løftet ikke hånden. Hun løftet bare blikket, og det var nok til at Marit visste at alt var som før, og at ingenting var det.

      «Du kom,» sa bestemor da Marit åpnet døren.

      «Ja.»

      «Du ble lenge borte.»

      «Ja.»

      Det var det eneste hun klarte å si. Hun hadde øvd på setninger hele veien fra byen, lange og velformulerte setninger om hvorfor hun ikke hadde ringt, om hvor travelt det hadde vært, om at hun hadde tenkt på henne hver dag. Nå var de alle borte, og igjen var bare det lille ordet, gjentatt, som en stein hun kunne holde seg i.

      Stuen luktet av tang og kaffe. Klokken på veggen gikk, men den gikk feil, og ingen hadde rettet den på mange år. På kommoden lå en nøkkel. Den var rusten og stor, og den lå der som om den ventet på noen som aldri kom. Marit visste hva den låste opp. Hun visste også at ingen i huset hadde åpnet den døra siden mamma dro.

      Hun satte seg på kanten av stolen. Hun hadde vært her hver sommer da hun var liten, og da hadde huset vært fullt av lyd: radioen som sang, fotsteg i trappa, gaffelen mot tallerkenen, bestemors stemme som ropte på noen som alltid var i nærheten. Nå var det stille. Vinden presset mot ruta, og fyret blunket, blunket, blunket over havet, som et øye som ikke fikk sove.

      «Har du hørt noe fra henne?» spurte Marit til slutt.

      Bestemor svarte ikke med en gang. Hun rørte i koppen, selv om det ikke var sukker i den. «Hun skriver til jul,» sa hun. «Det er nok.»

      Det var ikke nok, og begge visste det. Men ingen av dem sa det.

      «Du har ikke spist,» sa bestemor og reiste seg langsomt. Hun gikk som en som bærer noe tungt, selv om hendene var tomme.

      Marit så etter henne. Gulvplankene knirket under føttene hennes, ett knirk for hvert skritt, som en gammel samtale hun ikke kunne bli ferdig med.
  - id: v2
    tittel: "Vedlegg 2: «Om litteraturens oppgave» av Emil Ravn (1884)"
    forfatter: "Utdrag fra foredrag (fiktiv tekst for øving)"
    tekst: |-
      Mine herrer og damer. Man spør oss forfattere hva vi vil. Jeg svarer: vi vil se. Vi vil se mennesket slik det lever, i stuen og i fjøset, ved kontorpulten og ved vaskebaljen, og vi vil si hva vi ser.

      I årtier har litteraturen i dette landet vært en høytidsstund. Den har sunget om fedrelandet, om bondens enkle lykke og om kvinnens milde dyder. Det har vært vakkert, og det har vært falskt. Jeg har besøkt husmannsplasser der barna gikk uten sko i oktober, og ingen sang. Jeg har sett kvinner som ble gift fordi de ikke hadde noe valg, og ingen kalte det tvang. Hvorfor skal litteraturen tie om det som alle vet?

      Litteraturen skal ikke pynte. Den skal ikke fortelle at fattigdom er en lykke, eller at lydighet alltid belønnes. Den som skriver pene løgner, svikter sin tid.

      Litteraturen skal heller ikke bare underholde. Den skal sette problemer under debatt. Hvorfor har kvinnen så få rettigheter? Hvorfor er arbeideren fattig mens fabrikken blir rik? Hvorfor taler vi om moral, men gjør lite? Man har kalt slike spørsmål umoralske. Jeg kaller det umoralsk å la være å stille dem.

      Forfatteren er en iakttaker, ikke en prest. Han skal ikke preke, men vise. Når leseren har sett hvordan et menneske knuses av forholdene, trenger forfatteren ikke å si at det er urett. Leseren vet det. Og leseren går hjem med en ubehagelig tanke, og den tanken er begynnelsen på en forandring.

      Man har innvendt at en slik litteratur er for mørk. Jeg svarer at mørket ikke er vårt verk. Vi har bare tent lyset. Den som er redd for det han ser, bør spørre seg selv hvorfor det ser slik ut, og ikke skylde på dem som viste ham det.

      Og språket skal være ærlig. Folk snakker ikke i vers. Derfor skal heller ikke bøkene våre gjøre det. La en arbeidskone si det en arbeidskone ville sagt, og la leseren kjenne at han hører en virkelig stemme. Et språk som ikke finnes i virkeligheten, kan ikke fortelle sannheten om den.

      Dette er vår oppgave. Den er ikke bekvem, men den er nødvendig. Jeg takker for oppmerksomheten.
  - id: v3
    tittel: "Vedlegg 3: Sjøboden av Hanna Dahl (1886)"
    forfatter: "Utdrag fra roman (fiktiv tekst for øving)"
    tekst: |-
      Tidlig om morgenen stod Randi og sorterte fisk i sjøboden. Hendene var røde av kulde, og hun hadde sluttet å kjenne dem for lenge siden. På loftet sov de tre minste, tett sammen under ett eneste teppe. Den eldste, Johan, var allerede ute i båten med faren, åtte år gammel og for liten til å ro, men for stor til å være igjen.

      Boden luktet av salt og tran. Regnet slo mot taket, og vinden fant veien inn gjennom sprekkene mellom bordene. Randi hadde tettet dem med strie og mose i høst, men mosen hadde frosset og falt ut. Hun pustet i hendene og tok neste fisk.

      Hennes mann kom inn og satte seg på en tønne. Han hadde ikke tatt av seg sydvesten, og vann rant nedover ansiktet hans, så det var umulig å se om han gråt eller ikke. Han gråt ikke. Anders Hansen hadde ikke grått siden han var gutt.

      «Handelsmannen vil ikke gi mer kreditt,» sa han.

      «Da får vi klare oss uten,» sa Randi.

      «Vi har ikke mel til mandag.»

      Hun svarte ikke. Hun tok en torsk, åpnet den med ett snitt og la den i tønnen. Det var den femtiende i dag. For hver fisk fikk hun tre øre, og tre øre var mindre enn en brødskive kostet i byen. Hun hadde regnet det ut i vinter, mens hun lå våken og hørte ungene hoste: for å tjene til en sekk mel måtte hun sløye nesten tusen fisk.

      «Pastoren sier at Gud lar de arbeidsomme få sitt,» sa mannen.

      «Pastoren har aldri stått her,» sa Randi og tørket hendene i forklestoffet. «Og Gud har aldri vært i handelsmannens bok.»

      Han så på henne. Det var ikke sinne i blikket, bare en slags trøtthet som hadde vokst fast i ansiktet hans. «Det er ikke noe å si på handelsmannen,» sa han. «Han må jo leve han også.»

      «Det må vi alle,» sa Randi.

      Utenfor ropte noen. Det var naboen, Marta, som stod i døra med en pakke under armen. «Jeg hadde litt til overs,» sa hun og la pakken på benken. Det var en halv sekk havregryn. Randi nikket uten å takke, for takken ville ha gjort gaven til en gjeld, og begge kvinnene visste det.

      Da Marta var gått, ble Anders sittende. «Skipperen på Hvalnes trenger folk,» sa han etter en stund. «Hele vinteren. Det blir penger, om vi er heldige.»

      «Og ungene?»

      «Du klarer deg.»

      Randi så ned på torsken i hendene. Hun hadde klart seg i åtte år, tenkte hun. Hun hadde klart seg gjennom to dødfødsler, én vinter uten ved og én sommer uten mann. Det var ikke et ord hun trodde på lenger.

      Hun lukket øynene et øyeblikk. Så tok hun kniven og åpnet neste fisk.
  - id: v4
    tittel: "Vedlegg 4: Åtte timer av Selma Haug (2021)"
    forfatter: "Utdrag fra novelle (fiktiv tekst for øving)"
    tekst: |-
      Alex har fått ekstravakt, igjen. Telefonen lyser på nattbordet klokka halv seks om morgenen: Kan du ta lørdagen også? Hun skriver ja før hun har rukket å tenke.

      Hun står opp i halvmørket og trekker på seg uniformen. Den lukter ennå av kaffe fra i går, og hun har ikke tid til å vaske den. På bussen sovner hun stående, med hodet mot stangen. Hun våkner idet noen skubber henne ut av døren.

      På kafeen smiler hun til alle. Hun smiler til mannen som klager på kaffen, og til kvinnen som legger fra seg et tomt glass på gulvet. Sjefen har sagt at gjestene er viktigst, og at hun er heldig som har jobb i en tid som denne. Det er sant, sier hun til seg selv. Det er sant.

      «Du ser sliten ut,» sier Emil, som står ved siden av henne bak disken. Han er tjue og studerer, og han jobber her for å ha penger til ferier.

      «Jeg har sovet fint,» sier hun.

      «Er du sikker?»

      «Ja,» sier hun. «Hva skal det være, vi har kø.»

      I pausen sitter hun på en veltet vinkasse bak kjøleromsdøra og regner. Husleien er elleve tusen. Lønna er litt over tjue, og hun får bare betalt for timene hun står på. Hvis hun er syk, får hun ingenting. Hun har lest at hun har rett til noe annet, at det finnes regler og organisasjoner, men det er ingen som har tid til å fortelle henne hvor hun skal begynne.

      Hun legger telefonen på kneet. Det ligger tre uleste meldinger fra moren. Hun åpner ingen av dem.

      «Det går jo fint,» sier hun høyt til ingen.

      Det er det samme hun sa til moren i går. Moren hadde spurt om hun hadde nok mat, og Alex hadde ledd og sagt at hun spiste som en dronning. På kjøkkenet hjemme ligger det en halv pakke knekkebrød og en tube kaviar. Hun har lurt på om det er mulig å bli lei av kaviar.

      Etter pausen kommer en gruppe på åtte. De vil ha separate regninger, de vil ha havremelk, de vil ha plass ved vinduet, og de vil ha det nå. Alex noterer alt, uten å skrive feil. Hun har lært å være rask og vennlig samtidig, som en ferdighet hun ikke kan bruke til noe annet.

      Klokka er nesten åtte da hun går hjem. Hun har stått i elleve timer, men lønnen gjelder åtte. «Åtte timer,» sier hun for seg selv, som en liten, vanskelig regel.

      Ved bussholdeplassen ringer telefonen. Det er moren. Alex ser på skjermen til den slutter å lyse. Så åpner hun en melding og skriver: Alt bra her! Ses i helga.

      Hun går inn på kafeen igjen, fordi hun har glemt jakka. Sjefen står ved kassa og teller. «Åh, godt du er her,» sier han. «Kan du ta en time til?»

      «Selvsagt,» sier Alex. «Hva kan jeg hjelpe deg med i dag?»

      Han ler, som om det var en vits.
  - id: v5
    tittel: "Vedlegg 5: «Tomt på butikken» (Nordkyst-avisa, 2024)"
    forfatter: "Avisartikkel (fiktiv tekst for øving)"
    tekst: |-
      Da Brattvåg Landhandel stengte dørene i vår, mistet bygda ikke bare en butikk. Den mistet et sted der folk møttes.

      Butikken hadde ligget ved kaia siden 1952. Den solgte alt fra mel og spiker til garn og aviser, og den var åpen hver dag. Etter at skolen ble nedlagt for ti år siden, har innbyggertallet falt fra 340 til 218. Mange unge flytter for å studere, og få kommer tilbake. De som blir igjen, er stadig eldre. Gjennomsnittsalderen i bygda er nå over femti.

      «Det var her jeg fikk vite hvem som var syk og hvem som hadde fått barn,» sier Gunnvor Strand (79), som har handlet i butikken i seksti år. «Nå må jeg ta bussen en time for å kjøpe melk.» Bussen går to ganger om dagen, og siste avgang er klokka fire. «Hvis jeg blir syk om kvelden, er det ingen her.»

      Eierne, ekteparet Alvhild og Olav Brattvåg, forteller at kundegrunnlaget hadde falt jevnt i flere år. «Vi drev ikke for å tjene penger,» sier Alvhild. «Men vi måtte ha nok til å betale strømmen.» Da dagligvarekjeden åpnet en stor butikk i nabokommunen, kom de som fortsatt handlet her, stadig sjeldnere.

      Ordfører Terje Lund sier at kommunen jobber med å få på plass en nærbutikk drevet av frivillige. «Vi har sett at det kan fungere andre steder. Men det krever at folk vil. Det krever at noen tar på seg å stå i kassa hver dag, år etter år.»

      Ungdomslagets leder, Ida Sæther (19), er enig i at bygda trenger mer enn en butikk. «Jeg har ikke planer om å bli. Men jeg vil at det skal finnes et sted å komme hjem til.» Hun peker mot den tomme parkeringsplassen. «Det er ikke så mye å komme hjem til når alt er stengt.»

      Både ordføreren og Strand er skeptiske til at unge skal kunne «reddes tilbake» med tiltak alene. «Folk flytter dit det er arbeid og venner,» sier Lund. «Vi kan ikke tvinge noen. Men vi kan gjøre det lettere å bli.»

      Strand er mer kortfattet. «Man blir ikke på et sted som ikke blir i en tilbake.»
  - id: v6
    tittel: "Vedlegg 6: Hjem er et verb av Lars Eide (2019)"
    forfatter: "Utdrag fra sakprosabok (fiktiv tekst for øving)"
    tekst: |-
      Vi snakker om hjem som om det var et sted, noe med en adresse og en dør. Men jeg har truffet mennesker som har bodd i samme hus i femti år og aldri følt seg hjemme, og andre som har flyttet tolv ganger og alltid funnet noe som kunne kalles det.

      Da jeg skrev denne boken, intervjuet jeg over tretti mennesker som hadde forlatt det stedet de vokste opp. Noen hadde dratt for utdanning, noen for kjærligheten, og noen fordi det ikke fantes noe å bli for. De fleste fortalte om savn. Men savnet gjaldt sjelden et sted. Det gjaldt lukter, stemmer og små gester: måten faren åpnet kjøleskapet på, lyden av dørklokka, noen som alltid spurte om man hadde spist.

      Jeg tror at hjem er mer et verb enn et substantiv. Man hjemmer ikke bare der man bor, men der man gjør noe sammen med noen. Hjem blir til når vi lager mat til hverandre, når vi hører navnene våre sagt på en bestemt måte, når noen venter på oss uten å si at de venter.

      Det betyr også at hjemmet kan flyttes. Det kan lages på nytt, i en by som var fremmed, i et språk man ennå ikke kan. Det betyr at de som drar, ikke nødvendigvis svikter dem som blir. Men det betyr også at de som blir, ikke bare forvalter noe gammelt. De lager hjem hver dag.

      Jeg har lagt merke til at vi ofte snakker om bygder og byer som om de var to motpoler. Den ene er trygg og trang, den andre fri og anonym. Men de menneskene jeg møtte, beskrev ikke dette. De beskrev et valg som ikke var enten eller. Mange savnet bygda mest i byen, og mange savnet byen mest da de kom tilbake.

      Kanskje er dette det mest ærlige vi kan si om hjemlengsel: At den ikke er en feil. At den ikke forteller at vi tok feil valg. Den forteller bare at vi har elsket noe, og at kjærlighet ikke forsvinner av at vi flytter.
  - id: v7
    tittel: "Vedlegg 7: «Jeg dro, og savner ikke det jeg trodde» (2023)"
    forfatter: "Leserinnlegg (fiktiv tekst for øving)"
    tekst: |-
      Jeg vokste opp på en liten plass der alle kjente alle. Som tenåring ville jeg bare vekk. Alt jeg ønsket meg, lå i byen: kino, konserter, folk som ikke visste hva faren min het.

      Da jeg flyttet, var jeg sikker på at jeg aldri skulle angre. De første ukene var fulle av nye ting. Jeg gikk rundt i gatene og lette etter noe, uten å vite hva. Jeg kjøpte kaffe på steder som tok femti kroner for en kopp, og jeg tenkte at nå var jeg voksen.

      Nå bor jeg i en leilighet på fjerde etasje, og jeg kjenner ikke naboene. Det første året var jeg ensom på en måte jeg ikke hadde regnet med. Jeg savnet ikke fjellene. Jeg savnet at noen visste hvem jeg var.

      Så begynte jeg å spille i et korps. Det tok to år før jeg fikk venner, men nå har jeg et sted jeg går til hver tirsdag, og folk som spør hvordan jeg har det.

      Jeg skriver dette fordi jeg har lest mye om hvordan bygdene tømmes, og om at de unge må «tilbake». Jeg tror ikke jeg kommer til å flytte tilbake. Men jeg forstår at de som blir, ikke blir fordi de ikke tør noe annet. De blir fordi de vet hva de har.

      Kanskje handler det ikke om å bli eller dra. Kanskje handler det om å finne et sted der noen vet hvem man er.
  - id: v8
    tittel: "Vedlegg 8: Stolen (novelle)"
    forfatter: "Novelle (fiktiv tekst for øving)"
    tekst: |-
      Ole åpnet døren med nøkkelen han hadde hatt i lommen i tre år uten å bruke. Leiligheten luktet av gammel røyk og støv. På kjøkkenet stod to kopper på avdråpet, som om faren bare hadde gått ut en tur.

      Han ble stående i gangen. Skoene stod på rekke under knaggene, de svarte til søndagen og de brune til hverdagen, og ved siden av dem et par tøfler med hælen nedtrampet. Han la merke til at tøflene hadde form av en fot. Det var den eneste som var igjen.

      Ingrid hadde sagt at han kunne vente til våren. «Det haster ikke,» hadde hun sagt over telefonen fra Tromsø. «Leien er betalt ut måneden.» Men han hadde svart at han heller ville gjøre det nå, og han hadde ment det, selv om han ikke visste hvorfor.

      Han begynte med soverommet. Klærne la han i sekker, fordi det var det man gjorde. Skjortene var strøket og lagt i stabler etter farge, og det slo ham at faren hadde levd ordentlig, på en måte som ikke ga noen noe å klage på. Han fant ingen brev. Han fant ingen bilder av seg selv. På nattbordet lå en bok med en tannpirker som bokmerke, åpnet på side åttitre.

      Naboen kom ut idet han bar sekkene ned. En liten, gammel kvinne i kardigan, som la hånden på rekkverket for å stå stødig. «Du må være sønnen,» sa hun.

      «Ja.»

      «Han snakket om deg.»

      Ole stoppet med sekkene i hendene. «Gjorde han?»

      «Av og til. Han sa du hadde det bra.» Hun så på ham, og blikket var vennlig, men ikke særlig nysgjerrig. «Det var godt å høre.»

      Han nikket. Han ville spørre hva faren hadde sagt mer, men munnen ville ikke. Da hun gikk inn til seg, ble han stående i trappeoppgangen, og lyset slokket av seg selv.

      I stua stod stolen. Det var den store, den brune, den han ikke hadde fått sitte i som barn. «Den er min,» hadde faren sagt. Ole hadde alltid tenkt at han skulle gjøre narr av den en dag, om han noen gang fikk lov.

      Han hadde ikke regnet med at den skulle være så liten. I minnet hadde den vært et slott, et sted man satt og tok avgjørelser. Nå så han at ryggen var slitt, og at stoffet hadde løsnet i en søm ved foten. På gulvet foran den var teppet tynnere i en oval, akkurat der to føtter hadde hvilt, kveld etter kveld, år etter år.

      Nå satte han seg ned. Setet var slitt etter ett menneske, og dypet passet ikke helt til ham. Gjennom vinduet kom lyset skrått inn, og støvet svevde i det som små, rolige skip. Det var ikke noe fjernsyn, oppdaget han. Det var bare en radio, på hylla, vendt mot stolen.

      Han ble sittende lenge. Så oppdaget han at lenet på armen var glattere enn resten, akkurat der en hånd ville hvile. Han la sin egen hånd der, og trakk den bort igjen, som om han hadde rørt noe varmt.

      Telefonen ringte. Det var Ingrid. «Hvordan går det?»

      «Fint,» sa Ole. «Jeg er nesten ferdig med soverommet.»

      «Har du funnet noe?»

      Han så seg rundt. Stua var ryddig, som den alltid hadde vært. «Nei,» sa han. «Ingenting.»

      «Det var vel det jeg trodde,» sa hun. Og så, etter en pause som varte lenger enn den burde: «Han var ikke god til å si ting.»

      «Nei.»

      «Men han hadde jo en nøkkel til din leilighet.»

      Ole sa ingenting. Han hadde glemt det. Faren hadde bedt om en nøkkel da Ole flyttet til byen, for sikkerhets skyld, og Ole hadde gitt ham en. Nå lå den på kommoden i gangen, med en liten lapp i hans egen håndskrift: Ole. Han hadde ikke lagt merke til den da han kom. Den var blank, uten én ripe, som en nøkkel som aldri hadde vært brukt.

      Han la på. Utenfor begynte det å regne, tungt og jevnt. Han kunne høre det mot ruta, og et sted nedenfor en dør som smalt.

      Da han reiste seg, stod stolen igjen med en kurve etter ham.
oppgave1:
  vedlegg: v1
  innledning: "Les vedlegg 1 og svar på oppgaven. Skriv 250 til 300 ord."
  delsporsmal:
    - tekst: "Gjør rede for hvordan virkemidler blir brukt for å skildre stemningen i møtet mellom Marit og bestemoren. Bruk eksempler fra teksten og relevant fagspråk."
      ord: { min: 250, maks: 300 }
      modell: |-
        Utdraget skildrer et møte som er preget av ting som ikke blir sagt, og virkemidlene bidrar til å gjøre stemningen både stille og tung.

        Det første som slår en, er bruken av sammenligninger. Fyret beskrives som «hvitt og tungt som en gammel tanke». Sammenligningen gjør fyret til noe mer enn en bygning: det blir et symbol på alt som har ligget lenge og tynget. På samme måte beskrives bestemors gange «som en som bærer noe tungt, selv om hendene var tomme». Her får leseren et bilde av en sorg eller et savn som ikke kan ses, men som kjennes.

        Dialogen er et annet viktig virkemiddel. Replikkene er korte og gjentatte, med «Ja.» som eneste svar fra Marit. Gjentakelsen viser at de to har lite å si hverandre, og at begge unngår det som er vanskelig. Leseren forstår at det finnes en undertekst: avstanden mellom dem har blitt stor.

        Fortelleren bruker også symboler. Klokken «gikk feil» og er ikke rettet på mange år, og nøkkelen ligger «som om den ventet på noen som aldri kom». Begge viser at tiden har stoppet i huset og at noe er uavklart. I tillegg personifiseres fyret, som «blunket, blunket, blunket». Gjentakelsen og bildet av et øye som ikke fikk sove skaper en urolig og våken stemning.

        Samlet gir virkemidlene et stillferdig, men ladet møte. Sammenligningene og symbolene gir leseren bilder å forstå situasjonen med, mens dialogen og gjentakelsene viser at begge vegrer seg for å si det viktigste. Det som ikke sies, blir dermed like viktig som det som sies, og stemningen blir en blanding av savn, uro og ømhet.
oppgave2:
  valg:
    - id: fagartikkel
