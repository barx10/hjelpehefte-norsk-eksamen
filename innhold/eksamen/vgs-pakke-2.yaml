tittel: "Vgs pakke 2: Språk og nye former"
beskrivelse: "Denne pakken har et romanutdrag til kortsvaret og tre langsvarsoppgaver: en fagartikkel om modernistisk diktning, et essay om språk og tilhørighet, og en diktetolkning. Alle tekstene er skrevet for øving."
status: godkjent
nivaa: vg3
oppsett: vgs
kjennetegnStatus: utkast
vedlegg:
  - id: v1
    tittel: "Vedlegg 1: Ordene vi ikke bruker (romanutdrag)"
    forfatter: "Utdrag fra en roman (fiktiv tekst for øving)"
    tekst: |-
      Første skoledag i den nye klassen. Ida satt ytterst i rekken og holdt blyanten som om den kunne forsvinne.

      Klasserommet var større enn det hjemme, med store vinduer mot en skolegård hvor ingen ropte. Alle hadde allerede funnet plassene sine. De snakket lavt og raskt, i en rytme hun ikke kunne følge. Ida hørte setningene, men ikke ordene, som når man hører radio gjennom en vegg.

      «Hvor kommer du fra?» spurte jenta ved siden av henne.

      Ida åpnet munnen. Ordene lå klare, men de var feil. Hjemme sa man «ikkje» og «æ», her sa alle «ikke» og «jeg». Hun kjente at ørene ble varme.

      «Fra nord,» sa hun, og hørte at stemmen hennes ikke lød som hennes egen. Den var glattere, nesten fremmed, som en frakk lånt av en annen.

      Jenta nikket og smilte. «Du snakker så fint.»

      Fint, tenkte Ida. Det var det verste ordet hun kunne ha sagt. Fint betydde at det gamle var feil, at moren hjemme, som alltid sa «æ» og «kjære deg», snakket stygt. Hun så moren for seg ved kjøkkenbenken, med ermene brettet opp, og følte seg med ett uendelig utakknemlig.

      Læreren kom inn og ba dem presentere seg. Ida satt og talte på fingrene hvor mange som skulle før henne. Syv. Hun øvde setningen inni seg: Jeg heter Ida, jeg er femten år, jeg liker å tegne. Hver gang hun kom til «jeg», skiftet hun mening om hvordan det skulle uttales.

      Da turen kom til henne, sa hun det slik hun hadde øvd. Ingen lo. Ingen la merke til noe. Likevel var det som om hver stavelse hadde kostet henne en liten del av noe.

      I friminuttet stod hun ved vinduet og så på de andre. De pratet uten å tenke, med hendene i lommene, og hun misunnet dem så sterkt at det gjorde vondt. Det var ikke at de var bedre enn henne. Det var at de ikke trengte å bytte språk for å bli forstått.

      På kantina satt hun med en brødskive og lyttet. Rundt henne snakket de om en serie hun ikke hadde sett, en fest hun ikke var invitert til og en lærer de kalte ved fornavn. Hver gang noen så mot henne, smilte hun, litt for raskt, og så ned i maten. Hun tenkte at hvis hun bare ventet lenge nok, ville ordene komme til henne av seg selv, slik de hadde gjort hjemme, uten at hun trengte å velge dem. Men ordene her kom ikke til henne. De måtte hentes.

      Etter timen satt hun alene på toalettet og øvde. Jeg. Ikke. Jeg. Ikke. Hun gjentok ordene til de mistet mening og bare var lyder, som steiner i munnen.

      Om kvelden ringte moren. «Hvordan gikk det, vennen?»

      «Fint,» sa Ida. Hun hørte seg selv si det med den nye stemmen, og moren sa ingenting. Så sa moren, forsiktig: «Du høres så annerledes ut.»

      «Jeg er bare trøtt.»

      «Ja,» sa moren. «Det er du sikkert.»

      Da hun la på, ble hun sittende med telefonen i hånden. Hun hadde bestemt seg for å si så lite som mulig. Det var tryggest.
  - id: v2
    tittel: "Vedlegg 2: «Dikt i betong» av Johan Rød (1934)"
    forfatter: "Utdrag fra programartikkel (fiktiv tekst for øving)"
    tekst: |-
      Diktningen har for lenge bodd i skogen. Den har sunget om bekker og bjørker mens verden utenfor har fått tog, kraftlinjer og kontorer. Det er tid for å flytte diktet til byen.

      Vi skal skrive om det som er der: jern, betong, hastighet, støy. Vi skal ikke beskrive dem som et pent bakteppe, men som noe som forandrer hvordan mennesket tenker og føler. Den som stiger av toget i en storby, er ikke den samme som han som stod på bondegårdens tun. Hans sanser er annerledes, hans tid er annerledes, og hans frykt er annerledes. Diktningen må ha ord for dette.

      Rimet har tjent oss lenge, men det tvinger tanken inn i en form den ikke har. Når livet er brutt opp i øyeblikk, må også diktet kunne brytes. Vi vil ha fritt vers, som følger pusten og tanken. Vi vil ha brudd, tomrom og overraskende bilder. En kraftledning kan være en sang, en stasjon kan være en dikterisk handling, om vi bare tør se.

      Diktet skal ikke forklare. Det skal vise, og så la leseren fullføre. Det finnes ingen fasit, bare et møte mellom to mennesker, den som skriver og den som leser. Den som ber om å få alt forklart, ber om å slippe å tenke selv.

      Og diktet skal være ærlig om det moderne menneskets ensomhet. Vi er flere enn noen gang, og likevel alene. Folk sitter side om side i trikken og kjenner ikke hverandres navn. Det er et sant tema, og det fortjener nye ord.

      Man vil innvende at vi forakter det gamle. Det gjør vi ikke. Vi forakter bare at det gamle skal være det eneste. Hver tid må få sin egen stemme, og vår stemme låter som tog.

      Jeg vil avslutte med en oppfordring til de unge: Skriv ikke slik som man har skrevet før. Skriv slik som du lever.
  - id: v3
    tittel: "Vedlegg 3: «Stasjon» av Karen Vik (1936)"
    forfatter: "Dikt (fiktiv tekst for øving)"
    tekst: |-
      Toget kommer uten å ta ordet.
      Folk går av som tanker.

      Jeg står med hendene
      i et vær som ikke er mitt.

      Jeg hører fottrinn
      som noen andre har glemt.
      De går foran meg
      i en retning jeg ikke valgte.

      Under klokka
      leser noen en avis
      om et sted de aldri har vært.

      Det er ikke ensomhet.
      Det er bare at alle
      har med seg sin egen by.
  - id: v4
    tittel: "Vedlegg 4: «Pendling» av Nora Hvam (2019)"
    forfatter: "Prosadikt (fiktiv tekst for øving)"
    tekst: |-
      Tretti minutter til Lysaker. Tretti minutter med øreproppene i, hvor ingen snakker og alle hører. Jeg ser hendene deres: tommelen som skroller, tommelen som sletter, tommelen som sender hjerter til noen som er på samme tog, men ikke i samme vogn.

      Mannen ved siden av meg ler av noe. Han ser ikke opp. Latteren er bare for ham, og for skjermen, og for den som sendte det. Jeg ser at han vil dele det med noen, og at alle vi andre er for nær til å spørres.

      Utenfor løper husene forbi som slettede meldinger. Jeg tenker at vi aldri har vært så nær hverandre og så langt unna. Jeg tenker at vi kunne sagt noe, men at det ville vært som å rope inn i en kirke.

      Jeg prøver å huske hvor lenge siden det er jeg hørte noen snakke på toget. Ikke i telefonen, men til hverandre. Jeg husker en gutt som spurte etter klokka, og at flere av oss forskrekket tok ut telefonene for å svare. Det var nesten som å bli tatt i noe.

      En kvinne har sovnet med hodet mot ruten. Hun våkner ikke av stoppene, men når toget bremser, åpner hun øynene i nøyaktig riktig sekund. En kroppslig kunnskap, tenker jeg. Det eneste vi ikke har outsourcet.

      Så åpner døren, og vi strømmer ut, hver for oss, med samme blå skjerm i ansiktet.
  - id: v5
    tittel: "Vedlegg 5: «Hva sier dialekten din om deg?» (2023)"
    forfatter: "Avisreportasje (fiktiv tekst for øving)"
    tekst: |-
      Jonas Berg (17) snakker bergensk hjemme, og noe som ligner østnorsk på skolen i Oslo. «Jeg merker ikke engang at jeg bytter,» sier han. «Det skjer av seg selv.»

      Han er ikke alene. En ny rapport fra et språkmiljø viser at mange unge tilpasser dialekten etter hvem de snakker med. Forskerne kaller det kodeveksling, og de mener det viser språklig styrke, ikke usikkerhet. «Å bytte mellom varianter krever at man hører forskjell, og at man vet hva som passer hvor,» sier forsker Kari Moen. «Det er en avansert evne, selv om den ser enkel ut.»

      Rapporten bygger på intervjuer med over to hundre ungdommer i fem byer. De fleste sier at de har endret måten å snakke på etter at de begynte på videregående, ofte uten å tenke over det. Noen gjør det for å passe inn. Andre gjør det for å bli forstått.

      Samtidig sier flere at de har opplevd å bli rettet på. «Læreren sa jeg måtte snakke ordentlig,» forteller Amina Haddad (16), som bruker en blanding av oslodialekt og ord fra urdu og somali sammen med vennene sine. «Men dialekten min er jo ordentlig. Den er min.»

      Andre forteller det motsatte. Sivert Hage (18) vokste opp på Helgeland og har beholdt dialekten, selv om han studerer i Trondheim. «Jeg tenkte jeg skulle slutte, men så merket jeg at folk husket meg bedre. Det ble nesten en fordel.»

      Språkforsker Moen mener holdningene har blitt bedre. «For tjue år siden skammet mange seg over dialekten sin. Nå er det mer stolthet. Men vi er ikke i mål. Fortsatt er det slik at noen dialekter får høyere status enn andre, og at noen språkvarianter, særlig fra unge med innvandrerbakgrunn, blir sett ned på.»

      Hun legger til at språk aldri er ferdig. «Det er lett å tro at slik vi snakker nå, er slik vi alltid har snakket. Spør besteforeldrene dine om hvilke ord de brukte som barn.»
  - id: v6
    tittel: "Vedlegg 6: Ord på reise av Mina Aas (2020)"
    forfatter: "Utdrag fra sakprosabok (fiktiv tekst for øving)"
    tekst: |-
      Ord er reisende. De krysser grenser uten pass, setter seg i nye munner og blir værende, eller drar videre. Norsk er full av ord som har kommet fra et annet sted: «skole» fra gresk, «kaffe» fra arabisk via flere språk, «sjekke» fra engelsk.

      Noen ord kommer med handel. Tyske kjøpmenn tok med seg hundrevis av ord til norske havner i middelalderen, og vi bruker dem fortsatt, uten å tenke over det: «bryggeri», «handel», «skomaker». Andre ord kommer med krig, religion, mote eller teknologi. De som kom med fransk på 1700-tallet, ga oss «trottoar» og «restaurant». De som kom med engelsk etter 1945, ga oss «jeans» og «cola» og, etter hvert, «chatte».

      Når vi sier at et ord «ikke er norsk», glemmer vi at ingen språk har vært rene. Norsk har lånt fra tysk, fransk, latin og engelsk i hundrevis av år. Det har ikke gjort språket svakere. Det har gjort det rikere. Et språk som ikke tar inn nye ord, er et språk som har sluttet å brukes.

      Likevel er det noe i oss som reagerer når språket endrer seg raskt. Vi kjenner igjen vårt eget språk i det gamle, og det nye minner oss om at tiden går. Eldre generasjoner har alltid kritisert de yngre for å bruke et dårligere språk. Det samme sa man om dem som skrev bokmål for hundre år siden, og om dem som i sin tid begynte å bruke dialekt i avisene.

      Kanskje handler bekymringen sjeldnere om språket enn om oss selv: Hva skjer med det vi kan, når verden begynner å snakke annerledes? Det er et fornuftig spørsmål. Men svaret er neppe at vi skal slutte å låne. Svaret er at vi må bli enige om hva vi vil ta vare på.

      Det betyr ikke at alt er likegyldig. Noen ord gjør oss mer presise, mens andre bare gjør oss uklare. Noen låneord fyller et tomrom, mens andre fortrenger gode ord vi allerede har. Å skille mellom dem krever at vi bruker språket med omtanke, ikke at vi sverger oss fra lånord.

      Norsk er ikke truet av ord som reiser. Det er truet av at færre bruker det med lyst.
  - id: v7
    tittel: "Vedlegg 7: «Jeg snakker to språk, og ingen er riktig» (2024)"
    forfatter: "Leserinnlegg (fiktiv tekst for øving)"
    tekst: |-
      Hjemme snakker vi somali. På skolen snakker jeg norsk. Med vennene mine snakker jeg en blanding, med ord fra begge og noen som vi har laget selv.

      Da jeg var liten, tenkte jeg ikke over det. Jeg byttet språk som man bytter sko: uten å merke det. Det var først på ungdomsskolen jeg forsto at noen hørte det som en feil.

      Noen ganger sier lærere at jeg må snakke «ordentlig norsk». Noen ganger sier familien min at jeg har glemt hvem jeg er. Besteforeldrene mine i Hargeisa forstår ikke alt jeg sier, og jeg forstår ikke alt de sier. Vi smiler og peker, og det hjelper.

      Jeg lurer på hvem som bestemmer hva som er riktig. Er det de som snakker, eller de som ikke bryr seg om hvordan andre snakker?

      Jeg tror at språket mitt er en bro, ikke en feil. Når jeg bytter mellom språk midt i en setning, tenker jeg på to steder samtidig. Det er ikke dårlig norsk. Det er ikke dårlig somali. Det er et språk som har plass til meg.

      Så til dere som retter på oss: Spør heller hva ordene betyr. Jeg skal gjerne forklare.
  - id: v8
    tittel: "Vedlegg 8: «Rom» (dikt)"
    forfatter: "Dikt (fiktiv tekst for øving)"
    tekst: |-
      Du sier at det finnes et rom
      i huset vi aldri åpner.
      Jeg har gått forbi det
      så mange ganger at døren
      har lært navnet mitt.

      I går la jeg øret mot treet.
      Det var ikke stille.
      Det var som å lytte til noen
      som holder pusten
      og venter på at jeg skal gå først.

      Kanskje har du også stått her.
      Kanskje har dine hender
      holdt rundt den samme kalde klinken
      og latt den bli.
      Vi snakker om været.
oppgave1:
  vedlegg: v1
  innledning: "Les vedlegg 1 og svar på oppgaven. Skriv 250 til 300 ord."
  delsporsmal:
    - tekst: "Gjør rede for hvordan virkemidler blir brukt for å skildre Idas usikkerhet. Bruk eksempler fra teksten og relevant fagspråk."
      ord: { min: 250, maks: 300 }
      modell: |-
        Utdraget bruker flere virkemidler for å vise at Ida er usikker på hvem hun er i møte med et nytt språk og et nytt sted.

        Et viktig virkemiddel er sammenligning. Idas nye stemme beskrives som «en frakk lånt av en annen». Bildet viser at hun opplever det nye språket som noe ytre, ikke noe som hører til henne. Senere gjentas ordene «Jeg. Ikke.» til de blir «som steiner i munnen». Sammenligningen gjør det nye språket tungt og vanskelig å bære.

        Gjentakelsen av «Jeg. Ikke. Jeg. Ikke.» fungerer også som et virkemiddel i seg selv. Den korte, hakkete rytmen viser at Ida øver, nesten desperat, på å bli noen andre. Når ordene til slutt mister mening, forsterker det følelsen av å miste noe av seg selv.

        Teksten bruker kontrast mellom dialekten hjemme og språket på skolen. Ordene «ikkje» og «æ» settes opp mot «ikke» og «jeg». Kontrasten gjør forskjellen konkret og viser at språk er knyttet til tilhørighet.

        Fortelleren viser også Idas indre gjennom kroppen: «ørene ble varme». Dette er et indirekte virkemiddel som viser skam uten at fortelleren sier det rett ut. Ordet «fint» gir leseren et blikk inn i hennes tanker og viser at et enkelt kompliment kan oppleves som et hugg.

        Slutten, «Det var tryggest», er kort og avslutter med et valg om å tie. Samlet viser virkemidlene en jente som mister trygghet. Sammenligninger, gjentakelse og kontrast gjør språket til mer enn ord: det blir et spørsmål om hvem hun får lov til å være, og om hva hun må gi fra seg for å høre til.
oppgave2:
  valg:
    - id: fagartikkel
      tittel: "A: Fagartikkel om modernistisk diktning"
      tekst: "Skriv en fagartikkel der du gjør rede for hva Johan Rød mener at diktningen skal gjøre, og drøfter hvordan tekstene til Karen Vik og Nora Hvam følger eller bryter med dette. Bruk fagspråk, og vis til eksempler fra vedleggene."
      mal: fagartikkel-vgs
      vedlegg: [v2, v3, v4]
      ord: { min: 800, maks: 1300 }
      nokkelord: ["modernisme", "fritt vers", "bilde", "fremmedgjøring", "kontekst", "virkemiddel", "tema", "undertekst"]
      nokkelordMinst: 4
      sitat: true
      kjennetegn:
        - "Innledningen presenterer emnet og stiller en problemstilling om hva moderne diktning skal gjøre."
        - "Du gjør rede for Røds syn: byen og det moderne som tema, fritt vers, brudd, bilder og ensomhet."
        - "Du skiller mellom redegjørelsen og drøftingen."
        - "Du drøfter begge tekstene mot Røds krav, med minst ett sitat fra hver."
        - "Du bruker fagspråk som modernisme, fritt vers, bilde, fremmedgjøring og undertekst."
        - "Du setter tekstene i kontekst: 1930-årene og 2010-årene, og nevner at teknologien er ny i begge tidene."
        - "Du har motforestillinger, for eksempel at Hvams tekst er prosa og ikke vers, men likevel følger Røds ånd."
        - "Avslutningen svarer på problemstillingen, og alle vedlegg står i kildelisten."
    - id: essay
      tittel: "B: Essay om språk og tilhørighet"
      tekst: "Skriv et essay der du utforsker og reflekterer over innholdet i de vedlagte tekstene."
      mal: essay-vgs
      vedlegg: [v5, v6, v7]
      ord: { min: 800, maks: 1300 }
      nokkelord: []
      sitat: false
      kjennetegn:
        - "Inngangen er konkret, for eksempel en språkopplevelse eller en setning fra et vedlegg."
        - "Du har en rød tråd om språk og tilhørighet, og hvert avsnitt tar tanken videre."
        - "Du bruker alle tre vedleggene og lar dem si noe ulikt."
        - "Du veksler mellom egne erfaringer med språk og kunnskap fra tekstene."
        - "Du bruker begreper som dialekt, kodeveksling, lånord og identitet."
        - "Du utforsker spørsmål som hvem som bestemmer hva som er riktig."
        - "Slutten gir leseren noe å tenke på."
        - "Du har oppgitt kildene."
    - id: tolkning
      tittel: "C: Tolk diktet"
      tekst: "Tolk diktet."
      mal: litteraer-tolkning-vgs
      vedlegg: [v8]
      ord: { min: 800, maks: 1300 }
      nokkelord: ["tema", "metafor", "personifikasjon", "lyrisk jeg", "fritt vers", "undertekst", "virkemiddel", "tolkning"]
      nokkelordMinst: 4
      sitat: true
      kjennetegn:
        - "Innledningen presenterer diktet og en tydelig tolkningstese."
        - "Du skiller mellom motiv (et lukket rom) og tema."
        - "Du analyserer form: frie vers, strofer og brudd."
        - "Du analyserer bilder som personifikasjonen «døren har lært navnet mitt» og lyttingen ved døren."
        - "Du forklarer hva hvert virkemiddel gjør, og begrunner tolkningen med sitat."
        - "Du kommenterer slutten og hva den sier om forholdet mellom jeg og du."
        - "Du er forsiktig med påstander diktet ikke gir grunnlag for."
        - "Avslutningen svarer på hva diktet sier."
