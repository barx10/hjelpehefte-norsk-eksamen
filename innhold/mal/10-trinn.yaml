# Kompetansemål i norsk etter 10. trinn, hentet ordrett fra Udir (LK20).
# omfang: dekkes | delvis | senere | utenfor
#   dekkes   øves direkte i versjon 1
#   delvis   noen deler øves, andre ikke (se merknad)
#   senere   planlagt i en senere fase
#   utenfor  holdes bevisst utenfor (muntlig og språkhistorie)
- id: m10-01
  nivaa: '10'
  tekst: lese skjønnlitteratur og sakprosa på bokmål og nynorsk og i oversettelse fra samiske og andre språk, og reflektere over tekstenes formål, innhold, sjangertrekk og virkemidler
  omfang: delvis
  merknad: Heftet øver sjangertrekk, virkemidler og synsvinkel. Lesing av nynorsk og oversatte tekster øves ikke ennå.
- id: m10-02
  nivaa: '10'
  tekst: sammenligne og tolke romaner, noveller, lyrikk og andre tekster ut fra historisk kontekst og egen samtid
  omfang: senere
- id: m10-03
  nivaa: '10'
  tekst: beskrive og reflektere over egen bruk av lesestrategier i lesing av skjønnlitteratur og sakprosa
  omfang: senere
- id: m10-04
  nivaa: '10'
  tekst: lytte til og lese tekster på svensk og dansk og gjøre rede for innhold og språklige trekk
  omfang: senere
- id: m10-05
  nivaa: '10'
  tekst: utforske og reflektere over hvordan tekster framstiller unges livssituasjon
  omfang: senere
- id: m10-06
  nivaa: '10'
  tekst: gjenkjenne og bruke språklige virkemidler og retoriske appellformer
  omfang: dekkes
- id: m10-07
  nivaa: '10'
  tekst: bruke kilder på en kritisk måte, markere sitater og vise til kilder på en etterrettelig måte i egne tekster
  omfang: delvis
  merknad: Sitering, kildehenvisning og enkel kildekritikk øves. Søk og vurdering av kilder på nett øves ikke ennå.
- id: m10-08
  nivaa: '10'
  tekst: utforske og vurdere hvordan digitale medier påvirker og endrer språk og kommunikasjon
  omfang: utenfor
- id: m10-09
  nivaa: '10'
  tekst: bruke fagspråk og argumentere saklig i diskusjoner, samtaler, muntlige presentasjoner og skriftlige framstillinger om norskfaglige og tverrfaglige temaer
  omfang: delvis
  merknad: Bare den skriftlige delen og fagspråket øves. Muntlige former er utenfor.
- id: m10-10
  nivaa: '10'
  tekst: informere, fortelle, argumentere og reflektere i ulike muntlige og skriftlige sjangre og for ulike formål tilpasset mottaker og medium
  omfang: delvis
  merknad: Bare skriftlige sjangre øves.
- id: m10-11
  nivaa: '10'
  tekst: skrive tekster med funksjonell tekstbinding og riktig tegnsetting og mestre rettskriving og ordbøying på hovedmål og sidemål
  omfang: delvis
  merknad: Tegnsetting, tekstbinding og vanlige rettskrivingsfeil øves på hovedmål. Sidemål og ordbøying øves ikke ennå.
- id: m10-12
  nivaa: '10'
  tekst: bruke fagspråk og kunnskap om grammatikk, tekststruktur og sjanger i samtale om og bearbeiding av tekster
  omfang: delvis
  merknad: Fagspråk, tekststruktur og sjanger øves. Grammatikk øves ikke ennå.
- id: m10-13
  nivaa: '10'
  tekst: uttrykke seg i ulike sjangre og eksperimentere med sjangre på kreative måter
  omfang: senere
- id: m10-14
  nivaa: '10'
  tekst: lage sammensatte tekster og begrunne valg av uttrykksformer
  omfang: senere
- id: m10-15
  nivaa: '10'
  tekst: forklare den historiske bakgrunnen for bokmål og nynorsk og reflektere over statusen til de offisielle språkene i Norge i dag
  omfang: utenfor
- id: m10-16
  nivaa: '10'
  tekst: utforske språklig variasjon og mangfold i Norge og reflektere over holdninger til ulike språk og talespråkvarianter
  omfang: utenfor
