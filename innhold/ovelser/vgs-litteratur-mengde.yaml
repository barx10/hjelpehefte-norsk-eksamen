- id: vgs-mod-m-periode-1
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "Fabrikkeieren telte pengene to ganger før han la dem i skuffen. Ute i gården sto arbeiderne og ventet på lønna, som hadde vært for lav i tre måneder."
  alternativer: ["Realisme", "Modernisme"]
  riktig: 0
  forklaring: "Utdraget viser et samfunnsproblem i et hverdagsmiljø: makt, penger og lav lønn."
- id: vgs-mod-m-periode-2
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "– Du skal gifte deg med handelsmannen, sa far og la avisen fra seg. – Han har penger, og det har ikke vi. Datteren så ned i bordet og svarte ikke."
  alternativer: ["Realisme", "Modernisme"]
  riktig: 0
  forklaring: "Dialogen er troverdig, fortelleren kommenterer ikke, og teksten tar opp kvinnens begrensede valg."
- id: vgs-mod-m-periode-3
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "Hver morgen klokka fem gikk Marie ned til fiskebrygga. Hun sløyde fisk til det ble mørkt, og lønna holdt akkurat til husleia."
  alternativer: ["Realisme", "Modernisme"]
  riktig: 0
  forklaring: "Utdraget skildrer hverdagen og fattigdommen til en vanlig arbeider."
- id: vgs-mod-m-periode-4
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "Presten talte om dyd og orden fra prekestolen, mens tjenestejenta som hadde fått barn utenfor ekteskapet, satt alene bakerst i kirken."
  alternativer: ["Realisme", "Modernisme"]
  riktig: 0
  forklaring: "Utdraget stiller spørsmål ved moral og normer i samfunnet."
- id: vgs-mod-m-periode-5
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "Familien flyttet inn i to små rom i bakgården. Faren var arbeidsløs, og moren tok inn vask for å skaffe mat til de fem barna."
  alternativer: ["Realisme", "Modernisme"]
  riktig: 0
  forklaring: "Utdraget viser fattigdom i et konkret miljø og forklarer hvorfor familien har det slik."
- id: vgs-mod-m-periode-6
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "Konsulen holdt en lang tale om byens framgang. Ingen nevnte at det var hans skip som hadde forlist med tolv mann om bord, og at enkene ikke fikk noen hjelp."
  alternativer: ["Realisme", "Modernisme"]
  riktig: 0
  forklaring: "Utdraget kritiserer makt og dobbeltmoral i samfunnet."
- id: vgs-mod-m-periode-7
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "– En kone skal ikke ha egne meninger om penger, sa ektemannen. Helene la fra seg strikketøyet og så på ham lenge."
  alternativer: ["Realisme", "Modernisme"]
  riktig: 0
  forklaring: "Dialogen avslører maktforholdet i ekteskapet uten at fortelleren kommenterer."
- id: vgs-mod-m-periode-8
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "Bondesønnen kom til byen for å studere. Med klærne og dialekten sin skilte han seg ut blant de andre studentene, og han merket at de lo av ham."
  alternativer: ["Realisme", "Modernisme"]
  riktig: 0
  forklaring: "Utdraget tar opp klasseskiller og skildrer et troverdig miljø."
- id: vgs-mod-m-periode-9
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "byen / et rom uten dør / jeg går / og går / ingen ser meg"
  alternativer: ["Modernisme", "Realisme"]
  riktig: 0
  forklaring: "Frie vers, et bilde på et indre inntrykk og ensomhet i byen."
- id: vgs-mod-m-periode-10
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "Hun sitter på toget. Regnet. Mors stemme, den gangen, nei. Hvorfor tenker hun på det nå. Stasjonen glir forbi, grå, grå."
  alternativer: ["Modernisme", "Realisme"]
  riktig: 0
  forklaring: "Tankene kommer i den rekkefølgen de dukker opp. Det er bevissthetsstrøm."
- id: vgs-mod-m-periode-11
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "Jeg vet ikke lenger hvem jeg er. Ansiktet i speilet er et annet ansikt hver morgen."
  alternativer: ["Modernisme", "Realisme"]
  riktig: 0
  forklaring: "Utdraget handler om identitet og fremmedhet. Det er et eksistensielt spørsmål."
- id: vgs-mod-m-periode-12
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "asfalten puster / lyktestolpene står / som stumme soldater / i natt / er jeg ingen"
  alternativer: ["Modernisme", "Realisme"]
  riktig: 0
  forklaring: "Frie vers, bilder og en opplevelse av å forsvinne i byen."
- id: vgs-mod-m-periode-13
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "Han husker plutselig sommeren da han var sju. Eller var det åtte. Lukten av tjære. Så er han tilbake på kontoret, og telefonen ringer, men han tar den ikke."
  alternativer: ["Modernisme", "Realisme"]
  riktig: 0
  forklaring: "Teksten hopper i tid og følger personens indre liv."
- id: vgs-mod-m-periode-14
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "Klokka på veggen har stoppet. Ingen har skrudd den opp igjen. Hun sitter ved vinduet og venter, men hun vet ikke lenger hva hun venter på."
  alternativer: ["Modernisme", "Realisme"]
  riktig: 0
  forklaring: "Klokka er et symbol, og slutten er åpen. Leseren må selv fylle ut."
- id: vgs-mod-m-periode-15
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "maskinene / synger sin jernsang / og vi / er tannhjul / i en vogn ingen styrer"
  alternativer: ["Modernisme", "Realisme"]
  riktig: 0
  forklaring: "Frie vers og bilder av mennesket som en del av en maskin. Det viser fremmedgjøring."
- id: vgs-mod-m-periode-16
  type: flervalg
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: godkjent
  vanskegrad: 2
  spm: "Hvilken tradisjon passer utdraget best inn i?"
  utdrag: "Gatene var fulle av mennesker, men han kjente seg mer alene enn noen gang. Alt virket fjernt, som om han så verden gjennom en glassvegg."
  alternativer: ["Modernisme", "Realisme"]
  riktig: 0
  forklaring: "Utdraget handler om ensomhet i mengden og en subjektiv opplevelse av verden."
