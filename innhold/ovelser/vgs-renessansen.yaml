- id: vgs-ren-kort-ord
  type: flashkort
  kapittel: renessansen-vgs
  mal: [mvg2-02]
  status: godkjent
  vanskegrad: 1
  forside: "Hva betyr ordet «renessanse», og hva ble født på nytt?"
  bakside: "Gjenfødelse. Interessen for antikken, kulturen i det gamle Hellas og Romerriket, ble født på nytt."
- id: vgs-ren-kort-humanisme
  type: flashkort
  kapittel: renessansen-vgs
  mal: [mvg2-02]
  status: godkjent
  vanskegrad: 1
  forside: "Hva er humanismen?"
  bakside: "Tankene bak renessansen. Mennesket og livet her og nå står i sentrum, og hvert menneske kan utvikle seg gjennom kunnskap."
- id: vgs-ren-kort-adfontes
  type: flashkort
  kapittel: renessansen-vgs
  mal: [mvg2-02]
  status: godkjent
  vanskegrad: 2
  forside: "Hva betyr «ad fontes»?"
  bakside: "«Til kildene.» Humanistene ville lese de gamle tekstene på originalspråket: latin, gresk og hebraisk."
- id: vgs-ren-kort-sonett
  type: flashkort
  kapittel: renessansen-vgs
  mal: [mvg2-02]
  status: godkjent
  vanskegrad: 1
  forside: "Hva er en sonett?"
  bakside: "Et dikt på fjorten linjer med fast rim. Hos Petrarca er det to strofer på fire linjer og to på tre linjer."
- id: vgs-ren-kort-ramme
  type: flashkort
  kapittel: renessansen-vgs
  mal: [mvg2-02]
  status: godkjent
  vanskegrad: 1
  forside: "Hva er en rammefortelling?"
  bakside: "En fortelling som rammer inn andre fortellinger. I Dekameronen er flukten fra pesten rammen rundt de hundre historiene."
- id: vgs-ren-kort-mesen
  type: flashkort
  kapittel: renessansen-vgs
  mal: [mvg2-02]
  status: godkjent
  vanskegrad: 2
  forside: "Hva er en mesen?"
  bakside: "En rik person som betaler kunstnere og lærde for å lage kunst og skrive, som Medici-familien i Firenze."
