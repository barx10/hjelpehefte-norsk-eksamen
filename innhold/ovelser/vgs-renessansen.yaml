  vanskegrad: 2
  oppdrag: "Marker ordene som viser at teksten er typisk for renessansen."
  tekst: "Diktet er en [[sonett]] der jeget lengter etter den han elsker. Han sammenligner henne med [[Venus]], og han lover at diktet skal gjøre henne [[udødelig]]. Diktet sier lite om Gud, men mye om [[kjærlighet]]."
  forklaring: "Sonetten er en renessanseform, Venus kommer fra antikken, og tanken om at diktet gjør mennesket udødelig setter mennesket i sentrum. Kjærlighet og følelser er viktige motiver."
- id: vgs-ren-skriv-relevans
  type: skriv
  kapittel: renessansen-vgs
  mal: [mvg2-02]
  status: godkjent
  vanskegrad: 3
  oppdrag: "Skriv et avsnitt der du drøfter hvordan utdraget er relevant i dag."
  utdrag: "«Julie vet at faren har bestemt hvem hun skal gifte seg med. Men hun har allerede gitt hjertet sitt til Romeo, sønn av familiens verste fiende. Hun velger å trosse faren, selv om det kan koste henne alt.» (Gjenfortalt for øving etter Shakespeares Romeo og Julie.)"
  ord: {"min": 80, "maks": 180}
  nokkelord: ["renessansen", "individ", "i dag"]
  nokkelordMinst: 2
  sitat: true
  kriterier: ["Avsnittet starter med en tydelig påstand", "Jeg siterer eller viser konkret til utdraget", "Jeg knytter konflikten til renessansens syn på mennesket", "Jeg sammenligner med noe fra vår tid", "Jeg forklarer hva sammenligningen viser"]
  modelltekst: "Konflikten i Romeo og Julie er over 400 år gammel, men den treffer fortsatt. Julie skal gifte seg med den faren har valgt, men hun velger selv og trosser ham, «selv om det kan koste henne alt». Det er typisk for renessansen, som satte individet og retten til å velge selv i sentrum. Også i dag opplever noen unge at familien vil bestemme hvem de skal være sammen med. Tragedien viser hva som står på spill når familiens ære veier tyngre enn den unges ønsker, og derfor kan den leses som et forsvar for frihet til å velge selv."
