- id: vgs-kort-skriv-kortsvar
  type: skriv
  kapittel: kortsvar-vgs
  status: godkjent
  vanskegrad: 2
  oppdrag: "Gjør rede for hvordan virkemidler skaper stemning i utdraget. Bruk eksempler fra teksten og fagspråk."
  utdrag: "Utdrag fra en novelle (fiktiv tekst for øving):\n\nNatten hadde lagt seg over fjorden som et teppe. Aud stod ved kaia og lyttet. Alt var stille, bare vannet slo svakt mot stolpene, som om det hvisket. Hun holdt kappen tett om seg. Hvor ble han av? Hun så på klokka, som tikket høyere enn før."
  ord: { min: 80, maks: 150 }
  nokkelord: ["personifikasjon", "sammenligning", "stemning", "virkemiddel"]
  nokkelordMinst: 2
  sitat: true
  kriterier: ["Jeg navngir minst to virkemidler", "Jeg siterer fra teksten", "Jeg forklarer hva virkemidlene gjør med stemningen", "Jeg bruker fagspråk"]
  modelltekst: "Utdraget bruker virkemidler som gjør stemningen urolig og ventende. Teksten bruker en sammenligning når den skriver at natten har lagt seg «som et teppe». Det gjør at fjorden virker tung og stille. Vannet «hvisket» mot stolpene, og det er en personifikasjon som får omgivelsene til å virke levende og følge med. Til slutt bruker teksten et spørsmål, «Hvor ble han av?», som viser tankene til Aud direkte og forsterker uroen."
  modellkommentar: "Svaret navngir virkemidler, siterer og forklarer virkningen. Dette er også kortsvarets tre steg."
