  alternativer: ["Underdrivelse", "Kenning", "Ættetavle", "Frampek"]
  riktig: 0
  forklaring: "Han møter døden med få og rolige ord. Det er underdrivelse."
- id: vgs-norr-m-verdi-1
  type: flervalg
  kapittel: norront-vgs
  mal: [mvg2-01]
  status: utkast
  vanskegrad: 1
  spm: "Hvilken norrøn verdi kommer fram i utdraget?"
  utdrag: "Etter at broren ble drept, måtte Kåre ta hevn for å gjenopprette slektens ære."
  alternativer: ["Ære og hevn", "Folkeopplysning", "Romantisk lengsel", "Fornuft og kritikk"]
  riktig: 0
  forklaring: "Hevnen skal gjenopprette æren. Det er en sentral verdi i sagaene."
- id: vgs-norr-m-verdi-2
  type: flervalg
  kapittel: norront-vgs
  mal: [mvg2-01]
  status: utkast
  vanskegrad: 1
  spm: "Hvilken norrøn verdi kommer fram i utdraget?"
  utdrag: "Han visste at han skulle dø i slaget, men gikk likevel fram i første rekke."
  alternativer: ["Skjebnetro", "Folkeopplysning", "Fornuft og kritikk", "Naturdyrking"]
  riktig: 0
  forklaring: "Han møter en skjebne han ikke kan unngå. Det viser skjebnetro."
- id: vgs-norr-m-verdi-3
  type: flervalg
  kapittel: norront-vgs
  mal: [mvg2-01]
  status: utkast
  vanskegrad: 1
  spm: "Hvilken norrøn verdi kommer fram i utdraget?"
  utdrag: "Alt du eier, går tapt, men det folk sier om deg etter døden, lever videre."
  alternativer: ["Ettermæle", "Skjebnetro", "Gjestfrihet", "Hevn"]
  riktig: 0
  forklaring: "Tanken om at omdømmet lever videre, kalles ettermæle. Den finnes i Håvamål."
- id: vgs-norr-m-verdi-4
  type: flervalg
  kapittel: norront-vgs
  mal: [mvg2-01]
  status: utkast
  vanskegrad: 1
  spm: "Hvilken norrøn verdi kommer fram i utdraget?"
  utdrag: "Den som kommer inn fra kulden, trenger ild, mat og tørre klær."
  alternativer: ["Gjestfrihet", "Hevn", "Ettermæle", "Skjebnetro"]
  riktig: 0
  forklaring: "Rådet handler om å ta godt imot gjester. Det er gjestfrihet, en verdi i Håvamål."
