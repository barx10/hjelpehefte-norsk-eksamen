- id: vgs-norr-m-grep-1
  type: flervalg
  kapittel: norront-vgs
  mal: [mvg2-01]
  status: utkast
  vanskegrad: 2
  spm: "Hvilket kjennetegn viser utdraget?"
  utdrag: "Han så på såret og sa: «Det er ikke så farlig.» Neste morgen var han død."
  alternativer: ["Underdrivelse", "Frampek", "Ættetavle", "Kenning"]
  riktig: 0
  forklaring: "Et dødelig sår omtales med rolige ord. Det er underdrivelse."
- id: vgs-norr-m-grep-2
  type: flervalg
  kapittel: norront-vgs
  mal: [mvg2-01]
  status: utkast
  vanskegrad: 2
  spm: "Hvilket kjennetegn viser utdraget?"
  utdrag: "Den natten drømte Gudrun at hun mistet en gullring i vannet."
  alternativer: ["Frampek", "Underdrivelse", "Kenning", "Ættetavle"]
  riktig: 0
  forklaring: "Drømmen varsler at noe skal gå tapt. Det er et frampek."
- id: vgs-norr-m-grep-3
  type: flervalg
  kapittel: norront-vgs
  mal: [mvg2-01]
  status: utkast
  vanskegrad: 2
  spm: "Hvilket kjennetegn viser utdraget?"
  utdrag: "Torolv var sønn av Kveldulv, som var sønn av Bjalve."
  alternativer: ["Ættetavle", "Frampek", "Underdrivelse", "Kenning"]
  riktig: 0
  forklaring: "Sagaen forteller hvem personen stammer fra. Det er en ættetavle."
- id: vgs-norr-m-grep-4
  type: flervalg
  kapittel: norront-vgs
  mal: [mvg2-01]
  status: utkast
  vanskegrad: 2
  spm: "Hvilket kjennetegn viser utdraget?"
  utdrag: "Skalden skrev om «havets hest» som stevnet ut fra land."
  alternativer: ["Kenning", "Frampek", "Underdrivelse", "Ættetavle"]
  riktig: 0
