- id: vgs-norr-skriv-sammenlign
  type: skriv
  kapittel: norront-vgs
  mal: [mvg2-01]
  status: utkast
  vanskegrad: 3
  oppdrag: "Skriv et avsnitt der du sammenligner hvordan helten viser følelser i sagautdraget og i novelleutdraget. Bruk fagbegreper og sitat."
  utdrag: "Sagaen: «Gunnar sa: Jeg rir ikke bort. Så snudde han hesten og red hjem igjen.»\n\nNovellen: «Pappa satt lenge ved kjøkkenbordet etter begravelsen. Han sa ingenting, men han tok på seg jakka, tok den av igjen og hengte den tilbake på knaggen.»"
  ord: {"min": 80, "maks": 180}
  nokkelord: ["underdrivelse", "indirekte", "sagaen", "novellen"]
  nokkelordMinst: 3
  sitat: True
  kriterier: ["Avsnittet har en temasetning som sier hva som sammenlignes", "Begge tekstene blir sitert", "Fagbegreper som underdrivelse og indirekte personskildring blir brukt", "Avsnittet forklarer hva forskjellen eller likheten betyr"]
  modelltekst: "Både sagaen og novellen viser følelser gjennom handling, ikke gjennom ord. Gunnar sier bare «Jeg rir ikke bort» og snur hesten, og det er alt fortelleren forteller. Leseren må selv forstå at han velger hjemstedet framfor livet. Faren i novellen sier heller ingenting, men han tar jakka på og av igjen. Den lille handlingen viser at han ikke vet hvor han skal gjøre av seg. Begge tekstene bruker indirekte personskildring og underdrivelse, men virkningen er ulik. Hos Gunnar viser det mot og ære, mens det hos faren viser en sorg han ikke har ord for."
