  kapittel: norront-vgs
  mal: [mvg2-01]
  status: utkast
  vanskegrad: 2
  spm: "Hvilket kjennetegn viser utdraget?"
  utdrag: "Hallgerd svarte ikke. Hun gikk ut og ble stående ved døren lenge."
  alternativer: ["Indirekte personskildring", "Kenning", "Ættetavle", "Direkte personskildring"]
  riktig: 0
  forklaring: "Vi får ikke vite hva hun føler, men handlingen viser det. Det er indirekte personskildring."
- id: vgs-norr-m-grep-6
  type: flervalg
  kapittel: norront-vgs
  mal: [mvg2-01]
  status: utkast
  vanskegrad: 2
  spm: "Hvilket kjennetegn viser utdraget?"
  utdrag: "«Det skal bli hevnet,» sa han, og han sa ikke mer den kvelden."
  alternativer: ["Frampek", "Kenning", "Ættetavle", "Underdrivelse"]
  riktig: 0
  forklaring: "Replikken varsler hevn senere i sagaen. Det er et frampek."
- id: vgs-norr-m-grep-7
