  riktig: 0
  forklaring: "«Sårenes sjø» betyr blod. Det er en kenning."
- id: vgs-norr-m-grep-8
  type: flervalg
  kapittel: norront-vgs
  mal: [mvg2-01]
  status: utkast
  vanskegrad: 2
  spm: "Hvilket kjennetegn viser utdraget?"
