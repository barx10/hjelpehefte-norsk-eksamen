  mal: [mvg1-11, mvg3-08]
  status: utkast
  vanskegrad: 2
  oppdrag: "Skriv inn partisippet i rett form."
  kolonner: ["verb", "hankjønn og hokjønn", "inkjekjønn", "fleirtal"]
  rader:
    - ["å binde", "|bunden", "|bunde", "|bundne"]
    - ["å skrive", "|skriven", "|skrive", "|skrivne"]
    - ["å fryse", "|frosen", "|frose", "|frosne"]
  forklaring: "Sterke partisipp får -en i hankjønn og hokjønn, -e i inkjekjønn og -ne i fleirtal."
