- id: vgs-kont-skriv-kontekst
  type: skriv
  kapittel: kontekst-vgs
  mal: [mvg3-01]
  status: utkast
  vanskegrad: 3
  oppdrag: "Skriv et avsnitt der du bruker kontekst riktig i tolkningen av utdraget."
  utdrag: "Utdrag fra en novelle fra 1880-årene (fiktiv tekst for øving):\n\nDatteren stod i døren med hendene foldet. «Far, jeg vil gjerne bli i byen et år til.» Faren leste videre i avisen. «Det får vi snakke om,» sa han. Hun visste at samtalen var over."
  ord: { min: 70, maks: 140 }
  nokkelord: ["kontekst", "samfunn", "rettigheter", "tolkning"]
  nokkelordMinst: 2
  sitat: true
  kriterier: ["Jeg bruker konteksten til å forklare noe i teksten", "Jeg siterer fra utdraget", "Jeg trekker en linje til vår tid"]
  modelltekst: "Utdraget viser hvordan makten er fordelt uten at fortelleren sier det. Når faren svarer «Det får vi snakke om», er det et nei i høflige ord. Konteksten forklarer hvorfor: på 1880-tallet hadde unge kvinner få rettigheter, og faren avgjorde ofte livsvalg. Det forklarer også hvorfor datteren ikke protesterer. I dag er situasjonen annerledes, men tekstens tema om frihet og forventninger kjenner mange igjen."
