- id: vgs-mod-match-sammenligning
  type: matching
  kapittel: modernisme-vgs
  mal: [mvg3-02]
  status: utkast
  oppdrag: "Koble begrepet til forklaringen."
  par:
    - { venstre: "Fremmedgjøring", hoyre: "Følelsen av å stå utenfor og ikke høre til" }
    - { venstre: "Fragmentering", hoyre: "Teksten er brutt opp i biter" }
    - { venstre: "Undertekst", hoyre: "Det som antydes, men ikke sies" }
    - { venstre: "Postmodernisme", hoyre: "Lek, ironi og blanding av høy og lav kultur" }
  forklaring: "Begrepene hjelper deg å beskrive moderne tekster presist."
- id: vgs-mod-skriv-sammenligning
  type: skriv
  kapittel: modernisme-vgs
  mal: [mvg3-02, mvg3-04]
  status: utkast
  vanskegrad: 3
  oppdrag: "Sammenlign de to utdragene. Bruk synsvinkel og slutt som sammenligningspunkter."
  utdrag: "Tekst A (fiktiv, i realistisk stil):\n\nDet var en torsdag i oktober. Fru Berg gikk inn i kontoret til direktøren og bad om lønnsopplysning for mannen sin. «Det er ikke vanlig,» svarte han. Hun gikk hjem, og samme kveld sa hun til sønnen at han måtte lære seg å stå på egne ben.\n\nTekst B (fiktiv, i modernistisk stil):\n\nTorsdag. Eller var det onsdag. Jeg går, og gaten går med meg, og alle ansiktene har glemt navnet mitt. Kanskje jeg aldri hadde et. Døren står åpen, men det er ikke dit jeg skal."
  ord: { min: 90, maks: 170 }
  nokkelord: ["synsvinkel", "slutt", "samfunn", "indre", "realisme", "modernisme"]
  nokkelordMinst: 3
  sitat: true
  kriterier: ["Jeg sammenligner synsvinkelen i begge tekstene", "Jeg sammenligner slutten i begge", "Jeg siterer fra begge tekstene", "Jeg forklarer hva forskjellene betyr for hvordan tekstene viser menneske og samfunn"]
  modelltekst: "Tekstene bruker ulik synsvinkel. Tekst A er fortalt utenfra, med en fortellerstemme som holder seg i bakgrunnen: «Fru Berg gikk inn i kontoret til direktøren». Tekst B er fortalt i jeg-form og gir oss indre liv: «alle ansiktene har glemt navnet mitt». Forskjellen viser to måter å forstå mennesket på. I tekst A er personen formet av samfunnets regler, og slutten viser en konkret handling. I tekst B er personen fremmed i en verden uten tydelige svar, og slutten er åpen: «det er ikke dit jeg skal». Derfor kan tekst A leses som realistisk og tekst B som modernistisk."
