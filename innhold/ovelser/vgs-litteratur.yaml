  status: utkast
  vanskegrad: 2
  oppdrag: "Marker linjen som viser fremmedgjøring gjennom et bilde."
  tekst: "Jeg gikk gjennom byen i går. [[Byen er et rom uten dør.]] Folk gikk forbi meg som skip i tåke."
  forklaring: "Bildet «et rom uten dør» setter følelsen av å være innestengt og fremmed i sentrum. Det er typisk modernistisk."
