- id: komma-1
  type: flashkort
  kapittel: kommaregler
  mal: [m10-11, mvg1-11]
  status: godkjent
  forside: "Regel 1: komma mellom sideordnede setninger"
  bakside: "Komma mellom to helsetninger som er knyttet sammen med og, eller, men, for. Eksempel: «Alle jobbet, og de fleste ble ferdige i tide.»"
- id: komma-2
  type: flashkort
  kapittel: kommaregler
  mal: [m10-11, mvg1-11]
  status: godkjent
  forside: "Regel 2: komma foran «men»"
  bakside: "Alltid komma rett foran «men». Eksempel: «Hun var sliten, men fornøyd.»"
- id: komma-3
  type: flashkort
  kapittel: kommaregler
  mal: [m10-11, mvg1-11]
  status: godkjent
  forside: "Regel 3: leddsetning først"
  bakside: "Komma etter leddsetningen når den kommer før helsetningen. Eksempel: «Når vi er ferdige, kan vi ta pause.»"
- id: komma-4
  type: flashkort
  kapittel: kommaregler
  mal: [m10-11, mvg1-11]
  status: godkjent
  forside: "Regel 4: oppramsing"
  bakside: "Komma mellom hvert ledd. Eksempel: «Vi trenger kabel, klips, bryter og skruer.»"
- id: komma-5
  type: flashkort
  kapittel: kommaregler
  mal: [m10-11, mvg1-11]
  status: godkjent
  forside: "Regel 5: innskutte ledd"
  bakside: "Komma rundt forklarende tillegg midt i setningen. Eksempel: «Tore, den eldste sønnen, begynte på skolen.»"
- id: komma-6
  type: flashkort
  kapittel: kommaregler
  mal: [m10-11, mvg1-11]
  status: godkjent
  forside: "Regel 6: svarord og tiltaleord"
  bakside: "Komma etter svarord, og rundt tiltaleord. Eksempel: «Ja, det stemmer.» / «Jan, kom og spis!»"
- id: komma-kort-r7
  type: flashkort
  kapittel: kommaregler
  mal: [m10-11, mvg1-11]
  status: godkjent
  forside: "Regel 7: replikk og sitat"
  bakside: "Komma etter anførselstegnet når replikken står først: «Jeg kommer på fredag», sa han. Ikke komma hvis replikken slutter med spørsmålstegn eller utropstegn: «Kommer du?» spurte hun."
- id: komma-fv-men
  type: flervalg
  kapittel: kommaregler
  mal: [m10-11, mvg1-11]
  status: godkjent
  spm: "Hvilken setning har riktig komma?"
  alternativer: ["Hun var sliten, men fornøyd.", "Hun var sliten men fornøyd.", "Hun var sliten men, fornøyd.", "Hun var, sliten men fornøyd."]
  riktig: 0
  forklaring: "Regel 2: det skal alltid være komma rett foran «men»."
