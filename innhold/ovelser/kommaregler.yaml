  kapittel: kommaregler
  mal: [m10-11, mvg1-11]
  status: godkjent
  spm: "Hvilken kommaregel brukes her? «Når regnet stoppet, gikk vi ut.»"
  alternativer: ["Leddsetning først", "Oppramsing", "Svarord og tiltaleord", "Foran «men»"]
  riktig: 0
  forklaring: "«Når regnet stoppet» er en leddsetning som står foran helsetningen «gikk vi ut»."
