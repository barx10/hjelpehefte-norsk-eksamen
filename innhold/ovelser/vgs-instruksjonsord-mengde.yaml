  forklaring: "«Bruk fagspråk» og «vurder» er instruksjonsordene. Du skal bruke retoriske begreper og ta stilling."
- id: vgs-instr-m-marker-8
  type: marker
  kapittel: instruksjonsord-vgs
  status: utkast
  vanskegrad: 1
  oppdrag: "Marker instruksjonsordene i oppgaven."
  tekst: "[[Gjør rede for]] den retoriske situasjonen, og [[analyser]] hvordan teksten bruker appellformene."
  forklaring: "«Gjør rede for» og «analyser» er instruksjonsordene. Svaret har to deler."
