- id: vgs-instr-m-marker-1
  type: marker
  kapittel: instruksjonsord-vgs
  status: utkast
  vanskegrad: 1
  oppdrag: "Marker instruksjonsordene i oppgaven."
  tekst: "Skriv en fagartikkel der du [[gjør rede for]] synet på dialekt i vedlegg 1, og [[drøfter]] om dialektene er i ferd med å forsvinne."
  forklaring: "«Gjør rede for» og «drøfter» er instruksjonsordene. Svaret får en forklarende og en drøftende del."
- id: vgs-instr-m-marker-2
  type: marker
  kapittel: instruksjonsord-vgs
  status: utkast
  vanskegrad: 1
  oppdrag: "Marker instruksjonsordene i oppgaven."
  tekst: "[[Tolk]] diktet. [[Vis til]] eksempler fra teksten."
  forklaring: "«Tolk» og «vis til» er instruksjonsordene. Du skal si hva diktet betyr og bruke eksempler fra det."
- id: vgs-instr-m-marker-3
  type: marker
  kapittel: instruksjonsord-vgs
  status: utkast
  vanskegrad: 1
  oppdrag: "Marker instruksjonsordene i oppgaven."
  tekst: "[[Analyser]] hvordan avsenderen prøver å overbevise leserne, og [[vurder]] om teksten lykkes."
  forklaring: "«Analyser» og «vurder» er instruksjonsordene. Først undersøker du virkemidlene, så tar du stilling."
- id: vgs-instr-m-marker-4
  type: marker
  kapittel: instruksjonsord-vgs
  status: utkast
  vanskegrad: 1
  oppdrag: "Marker instruksjonsordene i oppgaven."
  tekst: "Skriv et essay der du [[utforsker]] hva vennskap betyr for unge i dag."
  forklaring: "«Utforsker» er instruksjonsordet. Det peker mot et åpent essay."
- id: vgs-instr-m-marker-5
  type: marker
  kapittel: instruksjonsord-vgs
  status: utkast
  vanskegrad: 1
  oppdrag: "Marker instruksjonsordene i oppgaven."
  tekst: "[[Sammenlign]] hvordan de to novellene framstiller ensomhet."
  forklaring: "«Sammenlign» er instruksjonsordet. Du skal finne likheter og forskjeller."
- id: vgs-instr-m-marker-6
  type: marker
  kapittel: instruksjonsord-vgs
  status: utkast
  vanskegrad: 1
  oppdrag: "Marker instruksjonsordene i oppgaven."
  tekst: "[[Reflekter]] over hvordan sosiale medier påvirker språket vårt. [[Bruk]] egne erfaringer og vedleggene."
  forklaring: "«Reflekter» og «bruk» er instruksjonsordene. Du skal veksle mellom erfaring og kunnskap."
- id: vgs-instr-m-marker-7
  type: marker
  kapittel: instruksjonsord-vgs
  status: utkast
  vanskegrad: 1
  oppdrag: "Marker instruksjonsordene i oppgaven."
