- id: vgs-instr-m-marker-10
  type: marker
  kapittel: instruksjonsord-vgs
  status: utkast
  vanskegrad: 1
  oppdrag: "Marker instruksjonsordene i oppgaven."
  tekst: "[[Drøft]] påstanden «Ungdom leser mindre enn før». [[Bruk]] minst to av vedleggene."
