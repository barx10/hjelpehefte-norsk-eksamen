  ord: { min: 80, maks: 150 }
  nokkelord: ["generalisering", "påstand", "troverdighet", "samtidig"]
  nokkelordMinst: 2
  sitat: true
  kriterier: ["Jeg har en påstand om hvordan ordet virker", "Jeg siterer fra innlegget", "Jeg har med en motforestilling", "Jeg vurderer til slutt"]
  modelltekst: "Innlegget bruker en generalisering når det hevder at ungdom «aldri» leser bøker. Ordet gjør påstanden sterk og enkel å huske. Samtidig er den lett å motbevise, siden mange unge faktisk leser, og det svekker troverdigheten til avsenderen. Påstanden kan likevel fungere som et grep for å vekke oppmerksomhet, men for en kritisk leser koster den mer enn den smaker."
