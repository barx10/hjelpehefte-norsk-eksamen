  kapittel: fagartikkel-vgs
  mal: [mvg3-09]
  status: godkjent
  oppdrag: "Marker setningen som er motforestillingen."
  tekst: "Teksten framstiller mobilbruk som en trussel mot samtalen. Det støttes av formuleringen «vi sitter sammen, men er likevel alene». [[Samtidig kan formuleringen virke overdrevet, siden den ikke tar hensyn til at mobilen også gjør det mulig å holde kontakt over avstand.]] Det svekker tekstens troverdighet, men ikke poenget om oppmerksomhet."
  forklaring: "Motforestillingen viser en annen side av saken. Den gjør drøftingen mer troverdig."
