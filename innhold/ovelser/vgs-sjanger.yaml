- id: vgs-tolk-skriv-tolkning
  type: skriv
  kapittel: litteraer-tolkning-vgs
  mal: [mvg3-04]
  status: godkjent
  vanskegrad: 3
  oppdrag: "Skriv et tolkende avsnitt om diktet. Bruk påstand, belegg, forklaring og kobling."
  utdrag: "Diktet «Havn» (fiktiv tekst for øving):\n\nHavna sover under tåka,\nskipene puster tungt.\nAlt jeg sa ble liggende igjen\npå kaia, kaldt og urørt.\n\nDu er en brygge uten båter.\nJeg står der likevel\nog venter, som om tiden\nkunne snu av seg selv."
  ord: { min: 80, maks: 160 }
  nokkelord: ["metafor", "personifikasjon", "tema", "tolke", "savn"]
  nokkelordMinst: 2
  sitat: true
  kriterier: ["Jeg har en tydelig påstand om hva diktet betyr", "Jeg siterer fra diktet", "Jeg forklarer hvordan sitatet støtter påstanden", "Jeg knytter avsnittet til temaet"]
  modelltekst: "Diktet viser savn og venting som en tilstand det ikke finnes noen vei ut av. Det viser seg i bildet «Du er en brygge uten båter». Metaforen gjør den andre til et sted der ingen kommer til, og det understreker at det som ble sagt, ble liggende «kaldt og urørt» på kaia. Dermed kan diktet leses som et portrett av en person som vet at ventingen er forgjeves, men likevel blir stående."
