- id: vgs-ret-marker-patos
  type: marker
  kapittel: retorisk-analyse-vgs
  mal: [mvg3-07]
  status: godkjent
  oppdrag: "Marker setningen som først og fremst appellerer til følelser."
  tekst: "Tiltaket kommer til å koste 40 millioner kroner over fem år. [[Tenk på alle de eldre som sitter alene i kveld og venter på at noen skal ringe.]] Analysen er laget av en uavhengig forsker."
  forklaring: "Den midterste setningen vekker medfølelse og er patos. Tallet er logos, og den siste setningen støtter etos."
- id: vgs-ret-skriv-analyse
  type: skriv
  kapittel: retorisk-analyse-vgs
  mal: [mvg3-07]
  status: godkjent
  vanskegrad: 3
  oppdrag: "Skriv en kort retorisk analyse av innlegget. Bruk etos, logos og patos, og vurder om teksten virker."
  utdrag: "Debattinnlegg «Gi oss åpne bibliotek» (fiktiv tekst for øving), skrevet av en biblioteksjef:\n\nHver kveld sitter 30 ungdommer og gjør lekser på biblioteket vårt, fordi det er stedet de kan være uten at noen spør hvorfor. Likevel vil kommunen redusere åpningstiden med to dager. Det vil koste oss noen hundre tusen kroner å holde åpent. Det vil koste samfunnet mye mer å la dem miste stedet. Vi må ikke la dørene lukke seg for dem."
  ord: { min: 100, maks: 180 }
  nokkelord: ["avsender", "etos", "logos", "patos", "målgruppe"]
  nokkelordMinst: 4
  sitat: true
  kriterier: ["Jeg sier hvem avsenderen og mottakeren er", "Jeg bruker etos, logos og patos med sitat", "Jeg forklarer virkningen", "Jeg vurderer om teksten virker overbevisende"]
  modelltekst: "Innlegget «Gi oss åpne bibliotek» er skrevet av en biblioteksjef og er rettet mot kommunen og lokale politikere. Avsenderen bygger etos ved å vise til at hun kjenner brukerne, og hun åpner med en konkret observasjon: «30 ungdommer gjør lekser på biblioteket». Logos kommer inn når hun setter kostnaden ved å holde åpent opp mot kostnaden ved å la ungdommene miste stedet, men hun dokumenterer ikke tallene. Patos er mest tydelig i den siste setningen, «la dørene lukke seg for dem», som er et bilde som vekker medfølelse. Totalt virker innlegget troverdig og engasjerende, men argumentene ville vært sterkere med tall."
