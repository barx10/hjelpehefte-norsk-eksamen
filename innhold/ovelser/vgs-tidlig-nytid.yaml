- id: vgs-tid-skriv-relevans
  type: skriv
  kapittel: tidlig-nytid-vgs
  mal: [mvg2-02]
  status: utkast
  vanskegrad: 3
  oppdrag: "Skriv et avsnitt der du drøfter hvordan utdraget er relevant i dag."
  utdrag: "«Alle i bygda var enige om at jorden var flat. Studenten visste bedre, men da han så at ingen ville høre, sa han det de ville høre, for han ville gifte seg og få fred.» (Gjenfortalt for øving etter Holbergs Erasmus Montanus.)"
  ord: {"min": 80, "maks": 180}
  nokkelord: ["satire", "opplysningstiden", "i dag"]
  nokkelordMinst: 2
  kriterier: ["Avsnittet viser hva utdraget handler om", "Avsnittet knytter teksten til opplysningstiden", "Avsnittet sammenligner med noe konkret i dag", "Avsnittet vurderer hva som er likt og ulikt"]
  modelltekst: "Utdraget viser en student som gir etter for flertallet, selv om han vet at de tar feil. Holberg skrev i opplysningstiden, da fornuften skulle vinne over fordommer, og satiren gjør narr av både bygda og studenten. Det samme mønsteret ser vi i dag når folk gir etter for presset i en gruppe eller et kommentarfelt for å slippe konflikt. Forskjellen er at vi i dag har lett tilgang til kunnskap, men det hjelper lite når sannheten blir et spørsmål om hvem som vinner. Slik er komedien fortsatt en påminnelse om at fornuft krever mot."
