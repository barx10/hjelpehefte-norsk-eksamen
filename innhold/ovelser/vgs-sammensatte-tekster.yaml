  status: godkjent
  vanskegrad: 1
  forside: "Hvilke bildeutsnitt bør du kjenne?"
  bakside: "Totalbilde, halvtotal, halvnært, nærbilde og ultranært."
- id: vgs-sams-kort-feil
  type: flashkort
  kapittel: sammensatte-tekster-vgs
  mal: [mvg3-05]
  status: godkjent
  vanskegrad: 1
  forside: "Hva er den vanligste feilen i en analyse av en sammensatt tekst?"
  bakside: "Å beskrive skrift og bilde hver for seg uten å vise samspillet og uten å vurdere."
