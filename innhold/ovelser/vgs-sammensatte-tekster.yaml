- id: vgs-sams-skriv-samspill
  type: skriv
  kapittel: sammensatte-tekster-vgs
  mal: [mvg3-05]
  status: utkast
  vanskegrad: 3
  oppdrag: "Skriv et avsnitt der du analyserer og vurderer samspillet mellom skrift og bilde i kampanjeplakaten."
  utdrag: "Plakaten viser en ung jente i nærbilde. Hun ser rett på oss, og ansiktet er alvorlig. Bakgrunnen er grå. Nederst står det med store hvite bokstaver: «Jeg sa ifra. Ingen hørte.» Under står logoen til en hjelpetelefon for barn og unge."
  ord: {"min": 80, "maks": 180}
  nokkelord: ["nærbilde", "forankring", "blikk", "patos", "samspill"]
  nokkelordMinst: 3
  kriterier: ["Avsnittet beskriver bildet med fagbegreper", "Avsnittet viser hvordan skriften styrer tolkningen av bildet", "Avsnittet forklarer virkningen på mottakeren", "Avsnittet vurderer om samspillet fungerer"]
  modelltekst: "Plakaten bruker nærbilde og direkte blikk for å skape kontakt med oss som ser på. Jentas alvorlige ansikt og den grå bakgrunnen gir en tung stemning. Teksten «Jeg sa ifra. Ingen hørte.» forankrer bildet, slik at blikket ikke bare virker alvorlig, men anklagende. Vi blir selv en av dem som ikke hørte. Samspillet gir en sterk appell til patos, og logoen nederst viser hva vi kan gjøre. Jeg mener plakaten fungerer godt, fordi den gjør et stort problem personlig på et lite øyeblikk."
