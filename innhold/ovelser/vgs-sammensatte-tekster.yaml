- id: vgs-sams-kort-hva
  type: flashkort
  kapittel: sammensatte-tekster-vgs
  mal: [mvg3-05]
  status: godkjent
  vanskegrad: 1
  forside: "Hva er en sammensatt tekst?"
  bakside: "En tekst som bruker flere uttrykksformer samtidig, for eksempel skrift, bilde, lyd og farger."
- id: vgs-sams-kort-samspill
  type: flashkort
  kapittel: sammensatte-tekster-vgs
  mal: [mvg3-05]
  status: godkjent
  vanskegrad: 1
  forside: "Hvordan kan skrift og bilde spille sammen?"
  bakside: "De kan forsterke hverandre (si det samme), utfylle hverandre (gi ulik informasjon som til sammen gir budskapet) eller stå i kontrast (si noe ulikt)."
- id: vgs-sams-kort-utsnitt
