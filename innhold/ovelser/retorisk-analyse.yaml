- id: ret-fv-etos1
  type: flervalg
  kapittel: retorisk-analyse
  mal: [m10-06]
  status: utkast
  spm: "Hvilken appellform brukes i dette utsagnet? «Som sykepleier med tjue års erfaring har jeg sett hva ensomhet gjør med eldre.»"
