  forside: "Hva inneholder innledningen i en retorisk analyse?"
  bakside: "Ca. 4 linjer: Hvem er avsenderen? Hvem er mottakeren? Hva vil avsenderen oppnå? Hva gjør avsenderen for å oppnå dette?"
