  modelltekst: "I debattinnlegget «Legg bort telefonen» skriver en lærer til foreldre og skolestyre. Hun vil overbevise dem om at mobiler bør legges bort i timene. I denne teksten skal jeg analysere hvordan hun bruker etos, logos og patos for å nå fram."
