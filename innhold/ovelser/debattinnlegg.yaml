- id: debatt-kort-hva
  type: flashkort
  kapittel: debattinnlegg
  mal: [m10-10, mvg1-04]
  status: godkjent
  vanskegrad: 1
  forside: "Hva er et debattinnlegg?"
  bakside: "En kort argumenterende tekst der du tar stilling i en sak og prøver å overbevise leseren."
- id: debatt-kort-begreper
  type: flashkort
  kapittel: debattinnlegg
  mal: [m10-10, mvg1-04]
  status: godkjent
  vanskegrad: 1
  forside: "Hva er standpunkt, argument og premiss?"
  bakside: "Standpunkt: det du mener. Argument: en begrunnelse for standpunktet. Premiss: noe du går ut fra at leseren er enig i, og som du ikke begrunner."
- id: debatt-kort-godt
  type: flashkort
  kapittel: debattinnlegg
  mal: [m10-10, mvg1-04]
  status: godkjent
  vanskegrad: 1
  forside: "Hvilke tre spørsmål stiller du til et argument?"
  bakside: "Er det holdbart? Er det relevant? Er det sterkt nok mot motargumentene?"
- id: debatt-kort-skjult
  type: flashkort
  kapittel: debattinnlegg
  mal: [m10-10, mvg1-04]
  status: godkjent
  vanskegrad: 1
  forside: "Hva er forskjellen på åpen og skjult argumentasjon?"
  bakside: "Åpen argumentasjon bygger på fakta og logikk (logos). Skjult argumentasjon påvirker følelser og tillit (patos og etos)."
