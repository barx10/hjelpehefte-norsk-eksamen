- id: debatt-skriv-avsnitt
  type: skriv
  kapittel: debattinnlegg
  mal: [m10-10, mvg1-04]
  status: godkjent
  vanskegrad: 2
  oppdrag: "Skriv ett argumentavsnitt til et debattinnlegg med standpunktet «Skolen bør ha mobilfri skoledag». Begynn med argumentet, utdyp med et eksempel, og vis hvordan det støtter standpunktet."
  ord: {"min": 60, "maks": 130}
  nokkelord: ["for det første", "for eksempel", "derfor"]
  nokkelordMinst: 2
  kriterier: ["Avsnittet begynner med et tydelig argument", "Argumentet er utdypet med et konkret eksempel", "Avsnittet viser hvordan argumentet støtter standpunktet", "Argumentet er holdbart og relevant"]
  modelltekst: "For det første gir en mobilfri skoledag elevene mer tid til å snakke sammen. I dag sitter mange med hver sin skjerm i friminuttene, også de som egentlig vil være med i et fellesskap. Når mobilen ligger i skapet, blir det lettere å spille kort, prate eller bare henge sammen. For eksempel merket vi det da klassen prøvde en uke uten mobil: Flere ble med i fotballen, og ingen satt alene i hjørnet. Derfor er en mobilfri skoledag et enkelt grep som kan gjøre skolen til et bedre sted å være."
