- id: vgs-tale-marker-vurdering
  type: marker
  kapittel: talesprak-vgs
  mal: [mvg3-10]
  status: godkjent
  oppdrag: "Marker setningen som er en vurdering, ikke en beskrivelse."
  tekst: "Mange unge bruker lånord fra engelsk i hverdagen. [[Dette er et tydelig tegn på at språket forfaller.]] Lånord har kommet inn i norsk i hele historien."
  forklaring: "Den midterste setningen er en vurdering uten begrunnelse. De to andre beskriver."
- id: vgs-tale-skriv-avsnitt
  type: skriv
  kapittel: talesprak-vgs
  mal: [mvg3-10]
  status: godkjent
  vanskegrad: 3
  oppdrag: "Skriv et avsnitt som drøfter påstanden. Bruk fagbegreper og vis begge sider."
  utdrag: "Påstand fra et innlegg (fiktiv tekst for øving):\n\n«Ungdomsspråket truer det norske språket. Når unge mikser engelske ord inn i norsken, mister vi det vi har.»"
  ord: { min: 80, maks: 150 }
  nokkelord: ["ungdomsspråk", "lånord", "identitet", "samtidig", "tilhørighet"]
  nokkelordMinst: 3
  sitat: true
  kriterier: ["Jeg bruker fagbegreper", "Jeg ser saken fra to sider", "Jeg siterer fra påstanden", "Jeg konkluderer med en vurdering"]
  modelltekst: "Innlegget hevder at ungdomsspråket truer norsken fordi unge blander inn engelske ord. Det er riktig at mange unge bruker lånord fra engelsk, men språk har alltid tatt opp ord utenfra, slik dansketiden og mellomnorsken viser. Ungdomsspråket kan også leses som et uttrykk for tilhørighet og identitet, ikke som en trussel. Samtidig kan hastigheten sosiale medier gir, gjøre at endringene oppleves som mer dramatiske enn før. Totalt er det vanskelig å si at språket «mister» noe, siden det endrer seg i stedet for å forsvinne."
