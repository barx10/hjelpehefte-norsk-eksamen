- id: funk-skriv-1
  type: skriv
  kapittel: virkemidler
  mal: [m10-06, mvg3-01]
  status: godkjent
  oppdrag: "Skriv om forklaringen slik at den sier hva kontrasten viser om personen. Bruk sitatene."
  starttekst: "I diktet står det at jeget er «stille» og «grå», mens vennene er «høylytte» og «fulle av farger». Denne kontrasten gjør diktet spennende og fanger oppmerksomheten."
  ord: { min: 25, maks: 70 }
  nokkelord: ["kontrast"]
  kriterier: ["Jeg nevner virkemidlet.", "Jeg bruker sitatene som belegg.", "Jeg forklarer hva kontrasten viser om personen eller temaet."]
  modelltekst: "Jeget beskriver seg selv som «stille» og «grå», mens vennene er «høylytte» og «fulle av farger». Kontrasten viser at jeget føler seg utenfor, og at avstanden handler om hvem hun er, ikke bare om hva hun gjør. Slik forsterker kontrasten temaet: ensomheten i å være annerledes."
