  mal: [m10-06, mvg3-01]
  status: godkjent
  spm: "Hva er problemet med forklaringen?"
  utdrag: "Metaforen «jeg er et skip uten ror» får leseren til å se for seg bildet og gjør teksten spennende."
  alternativer: ["Den er så generell at den kunne gjeldt nesten alle metaforer.", "Den mangler et fagbegrep.", "Den er skrevet i presens.", "Den er for lang."]
  riktig: 0
  forklaring: "At en metafor får leseren til å «se for seg bildet», gjelder alle metaforer. Si hva bildet viser om temaet eller personen."
- id: funk-fv-4
