  forside: "Hvordan skriver du presist om funksjonen til et virkemiddel?"
  bakside: "Knytt det til temaet, en person eller stemningen i akkurat denne teksten. Ikke skriv bare at det «gjør teksten spennende»."
- id: funk-fk-test
  type: flashkort
  kapittel: virkemidler
  mal: [m10-06, mvg3-01]
  status: godkjent
  forside: "Hvordan tester du om forklaringen er for generell?"
  bakside: "Spør: Kunne setningen stått i en analyse av en helt annen tekst? Da er den for generell."
