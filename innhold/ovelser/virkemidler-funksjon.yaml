  status: godkjent
  spm: "Hvordan kan forklaringen av metaforen «jeg er et skip uten ror» bli bedre?"
  alternativer: ["Metaforen viser at jeget har mistet retningen i livet og driver dit andre bestemmer.", "Metaforen er et fint språklig bilde som gjør teksten levende.", "Metaforen handler om et skip.", "Metaforen gjør at leseren får lyst til å lese videre."]
  riktig: 0
  forklaring: "Den første forklaringen sier hva bildet betyr for jeget. Et skip uten ror kan ikke styre selv."
