  kapittel: virkemidler
  mal: [m10-06, mvg3-01]
  status: godkjent
  spm: "Hvilket virkemiddel er dette? «Hun lukket døren bak seg og ante ikke at hun aldri skulle åpne den igjen.»"
  alternativer: ["Frampek", "Vendepunkt", "In medias res", "Høydepunkt"]
  riktig: 0
  forklaring: "Setningen hinter om hva som skal skje senere. Det bygger spenning."
