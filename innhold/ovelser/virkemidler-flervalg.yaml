  kapittel: virkemidler
  mal: [m10-06, mvg3-01]
  status: godkjent
  spm: "En novelle åpner slik: «Døren sprakk opp, og alarmen gikk.» Hvilket virkemiddel er dette?"
  alternativer: ["In medias res", "Sirkelkomposisjon", "Parallellhandlinger", "Symbol"]
  riktig: 0
  forklaring: "Teksten starter midt i handlingen, uten innledning. Det gir umiddelbar dramatikk."
- id: virk-fv-sirkel
  type: flervalg
  kapittel: virkemidler
  mal: [m10-06, mvg3-01]
  status: godkjent
  spm: "En novelle begynner og slutter med at hovedpersonen står alene ved bussholdeplassen i regnet. Hvilket virkemiddel er dette?"
  alternativer: ["Sirkelkomposisjon", "Parallellhandlinger", "Vendepunkt", "Allusjon"]
  riktig: 0
  forklaring: "Teksten starter og slutter likt. Det gir en følelse av at lite har forandret seg."
