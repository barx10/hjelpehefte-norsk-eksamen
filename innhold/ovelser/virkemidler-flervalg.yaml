- id: virk-fv-sammenligning
  type: flervalg
  kapittel: virkemidler
  mal: [m10-06, mvg3-01]
  status: godkjent
  spm: "Hvilket virkemiddel er dette? «Hun løp som en gepard.»"
  alternativer: ["Sammenligning", "Metafor", "Personifikasjon", "Overdrivelse"]
  riktig: 0
  forklaring: "Utsagnet bruker «som» for å sammenligne. Uten «som» ville det vært en metafor."
- id: virk-fv-metafor
  type: flervalg
  kapittel: virkemidler
  mal: [m10-06, mvg3-01]
  status: godkjent
  spm: "Hvilket virkemiddel er dette? «Han er en løve på banen.»"
  alternativer: ["Metafor", "Sammenligning", "Besjeling", "Allusjon"]
  riktig: 0
  forklaring: "Han kalles direkte en løve, uten «som». Det er en metafor."
- id: virk-fv-personifikasjon
  type: flervalg
  kapittel: virkemidler
  mal: [m10-06, mvg3-01]
  status: godkjent
  spm: "Hvilket virkemiddel er dette? «Tiden stjeler dagene våre.»"
  alternativer: ["Personifikasjon", "Besjeling", "Sammenligning", "Gjentakelse"]
  riktig: 0
  forklaring: "«Tiden» er abstrakt og får en menneskelig handling (å stjele). Det er personifikasjon."
- id: virk-fv-besjeling
  type: flervalg
  kapittel: virkemidler
  mal: [m10-06, mvg3-01]
  status: godkjent
  spm: "Hvilket virkemiddel er dette? «Granene hvisket til hverandre i vinden.»"
  alternativer: ["Besjeling", "Personifikasjon", "Metafor", "Underdrivelse"]
  riktig: 0
  forklaring: "Trær er konkrete ting i naturen, og de får menneskelig atferd (å hviske). Det er besjeling."
- id: virk-fv-forskjell
  type: flervalg
  kapittel: virkemidler
  mal: [m10-06, mvg3-01]
  status: godkjent
  spm: "Hva er forskjellen på personifikasjon og besjeling, slik heftet skiller dem?"
  alternativer: ["Personifikasjon gjelder abstrakte ting, besjeling gjelder konkrete ting som dyr og planter", "Personifikasjon gjelder dyr, besjeling gjelder følelser", "Det er ingen forskjell", "Besjeling brukes bare i dikt"]
  riktig: 0
  forklaring: "«Tiden flyr» er personifikasjon (abstrakt). «Sola smiler» er besjeling (konkret)."
- id: virk-fv-retorisk
  type: flervalg
  kapittel: virkemidler
  mal: [m10-06, mvg3-01]
  status: godkjent
  spm: "Hvilket virkemiddel er dette? «Hvem vil vel bo i et samfunn der ingen bryr seg?»"
  alternativer: ["Retorisk spørsmål", "Gjentakelse", "Underdrivelse", "Kontrast"]
  riktig: 0
  forklaring: "Spørsmålet har et innebygd svar («ingen»). Det skal aktivere leseren, ikke få et svar."
- id: virk-fv-gjentakelse
  type: flervalg
  kapittel: virkemidler
  mal: [m10-06, mvg3-01]
  status: godkjent
  spm: "Hvilket virkemiddel er dette? «Vi gir oss ikke. Vi gir oss aldri. Vi gir oss ikke nå.»"
  alternativer: ["Gjentakelse", "Overdrivelse", "Allusjon", "Metafor"]
  riktig: 0
  forklaring: "Frasen «vi gir oss» gjentas. Det slår poenget fast."
- id: virk-fv-overdrivelse
  type: flervalg
  kapittel: virkemidler
  mal: [m10-06, mvg3-01]
  status: godkjent
  spm: "Hvilket virkemiddel er dette? «Jeg har sagt det tusen ganger.»"
