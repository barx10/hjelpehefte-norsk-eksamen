- id: opp-oppgave1
  type: flashkort
  kapittel: oppbygging
  status: godkjent
  forside: "Hva testes i oppgave 1, og hvor langt skal svaret være?"
  bakside: "Lesekompetanse: du viser at du har forstått teksten(e). Det er tre delspørsmål. Følg anbefalingen i oppgaven, for eksempel 1–2 setninger eller 100–150 ord."
- id: opp-oppgave2
  type: flashkort
  kapittel: oppbygging
  status: godkjent
  forside: "Hva testes i oppgave 2, og hvor langt skal svaret være?"
  bakside: "Skrivekompetanse: fri skriving etter oppgaveformulering. Omtrent 450–900 ord."
- id: opp-oppgave3
  type: flashkort
  kapittel: oppbygging
  status: godkjent
  forside: "Hva testes i oppgave 3, og hvor langt skal svaret være?"
  bakside: "Skrivekompetanse: skriving med tekstvedlegg. Omtrent 250–350 ord."
- id: opp-disponering
  type: flashkort
  kapittel: oppbygging
  status: godkjent
  forside: "Hvordan kan du disponere de fem timene?"
  bakside: "0:00–0:20 les alle oppgavene og vedleggene. 0:20–1:00 oppgave 1. 1:00–3:00 oppgave 2. 3:00–4:00 oppgave 3. 4:00–5:00 les gjennom, rett feil og sjekk at du svarer på det som ble spurt."
- id: opp-les-forst
  type: flashkort
  kapittel: oppbygging
  status: godkjent
  forside: "Hva gjør du før du begynner å skrive?"
  bakside: "Du leser alle tre oppgavene og tekstvedleggene nøye."
