- id: nov-rekke-frampek
  type: rekkefolge
  kapittel: novelleanalyse
  mal: [m10-06, m10-12]
  status: godkjent
  oppdrag: "Sett setningene i riktig rekkefølge i avsnittet om frampek."
  elementer: ["Novellen bruker frampek tidlig i teksten: Når Tord kommer for å få sønnen døpt, ønsker presten at barnet må bli ham «til velsignelse».", "Ønsket skaper en uro hos leseren, for vi lurer på hva det vil si.", "Når sønnen drukner, og Tord gir bort pengene sine, forstår vi at frampeket har pekt mot slutten hele veien.", "Velsignelsen kommer ikke gjennom stolthet, men gjennom sorg."]
  forklaring: "Avsnittet navngir virkemidlet og viser det, forklarer effekten og kobler det til slutten."
- id: nov-sort-avsnitt
  type: sortering
  kapittel: novelleanalyse
  mal: [m10-12]
  status: godkjent
  oppdrag: "Hvilket avsnitt i novelleanalysen hører setningen hjemme i?"
  kategorier: ["Innledning", "Handlingsreferat", "Oppbygging", "Synsvinkel", "Avslutning"]
  elementer:
    - tekst: "I denne teksten skal jeg analysere hvordan frampek og kontrast bidrar til å formidle temaet."
      kategori: 0
    - tekst: "En ung jente finner et gammelt brev i en kjellerbod og bestemmer seg for å lese det."
      kategori: 1
    - tekst: "Vendepunktet kommer når hun forstår hvem brevet er fra."
      kategori: 2
    - tekst: "Fortelleren er autoral refererende og beskriver bare det vi kan se og høre."
      kategori: 3
    - tekst: "Til slutt viser analysen at virkemidlene sammen forteller om et savn som aldri blir sagt høyt."
      kategori: 4
  forklaring: "Innledningen sier hva du skal gjøre. Referatet forteller hva som skjer. Oppbygging handler om vendepunkt og spenning. Synsvinkel handler om hvem som forteller. Avslutningen kobler tema og virkemidler."
