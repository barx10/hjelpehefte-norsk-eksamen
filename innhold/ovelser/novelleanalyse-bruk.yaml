- id: nov-rekke-innledning
  type: rekkefolge
  kapittel: novelleanalyse
  mal: [m10-12]
  status: godkjent
  oppdrag: "Sett setningene i riktig rekkefølge i innledningen."
  elementer: ["«Faderen» av Bjørnstjerne Bjørnson (1860) er en kort novelle om en rik og stolt bonde som mister sønnen sin og blir et ydmykt menneske.", "Bjørnson er kjent for et folkelig og direkte språk.", "I denne teksten skal jeg analysere hvordan frampek og indirekte personskildring bidrar til å formidle temaet om stolthet, sorg og forandring."]
