  mal: [m10-12]
  status: godkjent
  oppdrag: "Hvilket avsnitt i novelleanalysen hører setningen hjemme i?"
  kategorier: ["Innledning", "Handlingsreferat", "Oppbygging", "Synsvinkel", "Avslutning"]
  elementer:
    - tekst: "I denne teksten skal jeg analysere hvordan frampek og kontrast bidrar til å formidle temaet."
