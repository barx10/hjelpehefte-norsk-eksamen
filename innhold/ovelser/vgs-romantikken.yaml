- id: vgs-rom-skriv-sammenlign
  type: skriv
  kapittel: romantikken-vgs
  mal: [mvg2-03]
  status: godkjent
  vanskegrad: 3
  oppdrag: "Skriv et avsnitt der du sammenligner hvordan naturen framstilles i diktutdraget og i reklameteksten."
  utdrag: "Diktet: «Her på fjellet er jeg nær deg, Gud, / og alt det tunge blir igjen i dalen.» (Skrevet for øving i romantisk stil.)\n\nReklamen: «Finn roen. Finn deg selv. Opplev Norge.» Under står et bilde av en person alene på en fjelltopp i solnedgang."
  ord: {"min": 80, "maks": 180}
  nokkelord: ["romantikken", "naturen", "reklamen", "diktet"]
  nokkelordMinst: 3
  sitat: True
  kriterier: ["Avsnittet viser hvordan naturen framstilles i begge tekstene", "Begge tekstene blir sitert eller beskrevet konkret", "Avsnittet knytter diktet til romantikken", "Avsnittet forklarer hva forskjellen i formål betyr"]
  modelltekst: "Både diktet og reklamen viser fjellet som et sted der mennesket finner noe større enn seg selv. I diktet er fjellet et sted der jeget er «nær deg, Gud», og naturen får en hellig rolle, slik den ofte har i romantikken. Reklamen bruker det samme bildet: en person alene på en topp i solnedgang og ordene «Finn roen. Finn deg selv.» Forskjellen er formålet. Diktet uttrykker en religiøs lengsel, mens reklamen bruker den romantiske lengselen til å selge en reise. Slik viser reklamen at romantikkens syn på naturen fortsatt virker, men nå som en vare."
