  mal: [m10-11, mvg1-11]
  status: godkjent
  forside: "Også eller og så?"
  bakside: "«Også» betyr i tillegg: Jeg vil også ha is. «Og så» betyr og deretter: Vi spiste, og så gikk vi."
- id: forv-fk-ligge
