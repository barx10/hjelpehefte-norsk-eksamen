- id: forv-fk-naar
  type: flashkort
  kapittel: rettskriving
  undertema: Forvekslingsord
  mal: [m10-11, mvg1-11]
  status: godkjent
  forside: "Når eller nå?"
  bakside: "«Når» spør om tid eller innleder en leddsetning: Når kommer du? «Nå» betyr i dette øyeblikket: Jeg kommer nå."
- id: forv-fk-ogsa
