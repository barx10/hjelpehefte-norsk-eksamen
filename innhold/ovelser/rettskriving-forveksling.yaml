  kapittel: rettskriving
  undertema: Forvekslingsord
  mal: [m10-11, mvg1-11]
  status: godkjent
  forside: "Ligge eller legge?"
  bakside: "Gjør noen noe med tingen, er det «legge»: Jeg legger boka på bordet. Er tingen bare der, er det «ligge»: Boka ligger på bordet."
- id: forv-fk-sitte
