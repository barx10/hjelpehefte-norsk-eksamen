  status: godkjent
  forside: "Sjekkliste: hva kontrollerer du under «Faglig kvalitet»?"
  bakside: "Har du brukt minst tre fagbegreper der oppgaven ber om analyse? Har du forklart hva virkemidlene gjør, ikke bare nevnt dem? Har du brukt eksempler fra teksten, gjerne med sitat, som bevis?"
- id: sjekk-sprak
  type: flashkort
  kapittel: sjekkliste
  mal: [m10-11]
  status: godkjent
  forside: "Sjekkliste: hva kontrollerer du under «Språk og form»?"
  bakside: "Store bokstaver etter punktum. Sammensatte ord skrevet som ett ord. Kandidatnummer, ikke navn. Retteprogrammet sjekket på usikre ord. Lengdekravet i oppgaven er oppfylt."
