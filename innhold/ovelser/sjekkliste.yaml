  forside: "Huskeregel for virkemiddelanalyse: hvilke tre spørsmål besvarer du?"
  bakside: "1. Hva er virkemidlet? (Navngi det) 2. Hva er eksempelet? (Sitat fra teksten) 3. Hva gjør det? (Forklar effekten)"
- id: sjekk-struktur
  type: flashkort
