  status: godkjent
  forside: "Sjekkliste: hva kontrollerer du under «Tekst og struktur»?"
  bakside: "Har du svart på det oppgaven faktisk spør om? Har du tittel, innledning, hoveddel og avslutning? Starter hvert avsnitt med en temasetning? Har du hoppet over en linje mellom hvert avsnitt?"
- id: sjekk-faglig
