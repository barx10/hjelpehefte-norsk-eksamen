  status: godkjent
  spm: "Hvilken setning er riktig?"
  alternativer: ["Jeg liker å lese og skrive.", "Jeg liker og lese og skrive.", "Jeg liker å lese å skrive.", "Jeg liker og lese å skrive."]
  riktig: 0
