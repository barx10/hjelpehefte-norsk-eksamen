- id: rett-fv-de-dem
  type: flervalg
  kapittel: rettskriving
  mal: [m10-11]
  status: godkjent
  spm: "Hvilken setning er riktig?"
  alternativer: ["Jeg ser dem, men de ser ikke meg.", "Jeg ser de, men dem ser ikke meg.", "Jeg ser dem, men dem ser ikke meg.", "Jeg ser de, men de ser ikke meg."]
  riktig: 0
  forklaring: "«De» er subjekt og «dem» er objekt. «Jeg ser dem» (objekt), «de ser meg» (subjekt)."
- id: rett-fv-liten-forbokstav
