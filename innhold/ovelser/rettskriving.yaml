- id: rett-fk-to-ord
  type: flashkort
  kapittel: rettskriving
  mal: [m10-11]
  status: godkjent
  forside: "Hvordan skrives «i dag», «i morgen», «i går», «til slutt» og «for eksempel»?"
  bakside: "Alle skrives i to ord (for eksempel i dag, ikke idag). «For eksempel» kan forkortes til f.eks."
- id: rett-fk-sammensatt
  type: flashkort
  kapittel: rettskriving
  mal: [m10-11]
  status: godkjent
  forside: "Hvordan skrives sammensatte ord?"
  bakside: "Som ett ord: eksamensoppgave, ikke «eksamen oppgave»."
- id: rett-fk-liten
  type: flashkort
  kapittel: rettskriving
  mal: [m10-11]
  status: godkjent
  forside: "Hvilke ord skrives med liten forbokstav?"
  bakside: "Ukedager (mandag), måneder (mai), språk (norsk, engelsk) og folkeslag (nordmann)."
- id: rett-fk-stor
  type: flashkort
  kapittel: rettskriving
  mal: [m10-11]
  status: godkjent
  forside: "Hvilke ord skrives med stor forbokstav?"
  bakside: "Navn på personer og steder (Oslo, Norge), og første ord etter punktum."
- id: rett-fk-a-og
  type: flashkort
  kapittel: rettskriving
  mal: [m10-11]
  status: godkjent
  forside: "Når skriver du «å», og når skriver du «og»?"
  bakside: "«Å» står foran verb i infinitiv (å lese). «Og» binder sammen ord og setninger. «Jeg liker å lese og skrive.»"
- id: rett-fk-de-dem
  type: flashkort
  kapittel: rettskriving
  mal: [m10-11]
  status: godkjent
  forside: "Når skriver du «de», og når skriver du «dem»?"
  bakside: "«De» er subjekt: «De ser meg.» «Dem» er objekt: «Jeg ser dem.»"
- id: rett-fv-idag
  type: flervalg
  kapittel: rettskriving
  mal: [m10-11]
  status: godkjent
  spm: "Hvilken skrivemåte er riktig?"
  alternativer: ["i dag", "idag", "i-dag"]
  riktig: 0
  forklaring: "«I dag» skrives i to ord."
