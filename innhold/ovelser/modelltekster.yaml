  oppdrag: "Les etos-avsnittet i modellteksten. Skriv et tilsvarende etos-avsnitt om debattinnlegget «Legg bort telefonen» under."
  utdrag: "Etos-avsnittet i modellteksten: «Avsenderen er bare 15 år og ingen ekspert på likestilling. Det kan svekke etosen hans. Samtidig er han selv en av dem innlegget handler om, og det styrker den.»\n\nDebattinnlegg «Legg bort telefonen», skrevet av en lærer (fiktiv tekst for øving):\n\nHver dag sitter 25 elever i klasserommet mitt, og de fleste har mobilen i lomma. Jeg har undervist i tjue år og aldri sett konsentrasjonen falle så fort. Tenk deg å forklare en ny tanke mens halve klassen venter på neste varsel. Hvis vi legger bort telefonene i timene, vil elevene lære mer. Derfor må skolen sette en felles grense."
  ord: { min: 50, maks: 110 }
  nokkelord: ["etos", "troverdig"]
  nokkelordMinst: 2
  sitat: true
  kriterier: ["Avsnittet starter med en temasetning", "Jeg bruker et sitat fra innlegget i anførselstegn", "Jeg sier både hva som styrker og hva som svekker troverdigheten", "Jeg bruker ordene «etos» og «troverdig»"]
  modelltekst: "Avsenderen bygger etos ved å vise til egen erfaring. Hun skriver at hun har «undervist i tjue år», og det gjør henne troverdig som en som kjenner klasserommet. Samtidig er hun lærer og ikke forsker, så noen vil kanskje savne tall som viser at mobilen skader læringen. Likevel virker hun troverdig for foreldre og skolens ledelse."
