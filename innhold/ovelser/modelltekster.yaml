  oppdrag: "Les avslutningen i modellteksten. Skriv en avslutning til en diktanalyse av «Havn» på samme måte."
  utdrag: "Avslutningen i modellteksten om Gro Dahles dikt: «Gro Dahle bruker altså metaforer, kontrast og allusjon for å vise at moren går fra å være en sliter ingen ser, til å bli hyllet som en dronning. Diktet svarer på spørsmålet i tittelen: Det er våre mødre vi aldri ser, men vi burde verdsette dem mer.»\n\nDiktet «Havn» (fiktiv tekst for øving):\n\nHavna sover under tåka,\nskipene puster tungt.\nAlt jeg sa ble liggende igjen\npå kaia, kaldt og urørt.\n\nDu er en brygge uten båter.\nJeg står der likevel\nog venter, som om tiden\nkunne snu av seg selv."
  ord: { min: 30, maks: 80 }
  nokkelord: ["metafor", "tema"]
  nokkelordMinst: 1
  kriterier: ["Jeg nevner virkemidlene jeg har analysert", "Jeg sier hva diktet handler om (temaet)", "Jeg avslutter med en tanke som svarer på hva diktet vil si"]
  modelltekst: "Dikteren bruker metaforen «Du er en brygge uten båter» og besjelingen «Havna sover» for å gjøre ventingen konkret. Sammen viser de at temaet er savn, og at jeg-personen blir stående selv om ingenting kommer. Diktet sier at venting kan være en måte å holde fast på noen på."
