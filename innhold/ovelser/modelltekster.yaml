  riktig: 0
  forklaring: "Fortelleren står utenfor og kjenner tankene til gutten. Av og til bryter fortelleren inn med noe gutten ikke kunne ha tenkt selv. Det er autoral allvitende."
  utdrag: "Mesteparten av tiden er vi tett på gutten og får vite hva han tenker og føler. Av og til bryter fortelleren inn, for eksempel i «Hans lille hjerne skjønner ingenting»."
