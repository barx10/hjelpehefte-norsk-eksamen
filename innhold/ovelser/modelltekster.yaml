  mal: [m10-01, m10-06, m10-12]
  status: utkast
  oppdrag: "Marker fagbegrepene i avsnittet."
  tekst: "Novellen starter [[in]] [[medias]] [[res]]. Den første setningen kaster oss rett inn i hendelsen: «Plutselig begynner hans lille hjerte å slå veldig hardt og veldig raskt.» Vi vet ikke hva gutten er redd for, og det skaper uro. Hele novellen varer bare noen minutter. [[Vendepunktet]] kommer når den kraftige lyden smeller. Etterpå blir det stille: «Plutselig hører han ingenting, ingenting unntatt stillheten.» Helt til slutt kommenterer fortelleren: «Alle gatene i Sarajevo har blitt sånn: Noen rakk enden – og noen gjorde det ikke.»"
  forklaring: "«In medias res» betyr at teksten starter midt i handlingen. «Vendepunktet» er et tydelig skifte i handlingen. Begge er fagbegreper fra heftet."
- id: tekst-novelle-fv-blod
  type: flervalg
  kapittel: novelleanalyse
  fraTekst: modelltekst-blodspor-forenklet
  mal: [m10-01, m10-06, m10-12]
  status: utkast
  spm: "Hva viser utviklingen i ordet «blod» i dette utdraget?"
  alternativer: ["At håpet blir mindre, selv om gutten ikke forstår det", "At gutten blir tryggere", "At forfatteren vil gi fakta om krigen", "At det er en overdrivelse"]
  riktig: 0
  forklaring: "Blodet går fra «bitte små bloddammer» til blod fra magen. Det viser at håpet er ute, mens gutten ikke forstår det selv."
  utdrag: "Først er det «bitte små bloddammer» fra et lite skrubbsår, og det er fortsatt håp. Rundt ham ligger større bloddammer, og etter den kraftige lyden kommer blodet fra magen hans. Da forstår vi at håpet er ute, selv om gutten ikke forstår det selv."
- id: tekst-novelle-fv-synsvinkel
