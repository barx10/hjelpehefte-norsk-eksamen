  tekst: "Det viktigste virkemiddelet er [[metaforer]]. Allerede i begynnelsen er moren «støpt inn i kjøkkenbenken». [[Metaforen]] viser at hun nesten har blitt en del av kjøkkenet, så vi ser henne ikke lenger. I midten brukes en [[bakemetafor]]: moren «kjevler barna ut i deig». Hun former barna slik en baker former pepperkaker. Det viser hvor stor rolle en mor har i hvordan barna blir."
  forklaring: "Å navngi virkemidlet er første steg i en virkemiddelanalyse. Her står virkemidlet som «metaforer», «Metaforen» og «bakemetafor»."
