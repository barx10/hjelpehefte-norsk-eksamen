  oppdrag: "Skriv ett avsnitt om gjentakelsen av ordet «hjerte» i «Blodspor», med samme oppbygging som avsnittet om «blod»."
  utdrag: "Avsnittet om «blod» i modellteksten: «Det viktigste virkemiddelet er gjentakelse. Ordet «blod» går igjen. Først er det «bitte små bloddammer» fra et lite skrubbsår, og det er fortsatt håp. Rundt ham ligger større bloddammer, og etter den kraftige lyden kommer blodet fra magen hans. Da forstår vi at håpet er ute, selv om gutten ikke forstår det selv.»"
  ord: { min: 40, maks: 90 }
