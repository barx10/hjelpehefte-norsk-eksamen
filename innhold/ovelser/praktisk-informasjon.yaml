- id: prak-tid
  type: flashkort
  kapittel: praktisk-informasjon
  status: godkjent
  forside: "Hvor lang tid har du på eksamen i norsk, og er det forberedelsesdag?"
  bakside: "5 timer (kl. 09:00 til 14:00). Ingen forberedelsesdag. Eksamen starter direkte."
- id: prak-levering
  type: flashkort
  kapittel: praktisk-informasjon
  status: godkjent
  forside: "Hvordan leverer du besvarelsen?"
  bakside: "Eksamen er heldigital. Du leser oppgavene og leverer svar på nett, som ett samlet dokument med svar på alle tre oppgavene."
- id: prak-hjelpemidler
  type: flashkort
  kapittel: praktisk-informasjon
  status: godkjent
  forside: "Hvilke hjelpemidler er tillatt, og hva er ikke tillatt?"
  bakside: "Ordbøker, grammatikk og hefte er tillatt. KI er ikke tillatt."
- id: prak-kandidatnummer
  type: flashkort
  kapittel: praktisk-informasjon
  status: godkjent
  forside: "Hva skriver du på besvarelsen i stedet for navn?"
  bakside: "Kandidatnummer."
- id: prak-innsyn
  type: flashkort
  kapittel: praktisk-informasjon
  status: godkjent
  forside: "Når og hvor kan du se besvarelsen din etter eksamen?"
  bakside: "Dagen etter eksamen, på kandidat.udir.no."
- id: prak-fv-navn
  type: flervalg
  kapittel: praktisk-informasjon
  status: godkjent
  spm: "Hva skriver du på besvarelsen din?"
